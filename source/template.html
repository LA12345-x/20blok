<title>20 Blok</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: black magazine shell. Home = masthead, cover, cover lines, ranked square grid (4 / 3 / 2 cols). Article = one reading column with drop cap, pull quotes, figures. */
:root{
  --ink:#0B0B0C; --panel:#151517; --panel-2:#1C1C1F; --line:#2C2C31; --paper:#F5F2EA;
  --fg:#FFFFFF; --fg-soft:#D9D9DE; --muted:#A3A3AB; --red:#E0483B; --red-deep:#A8261C;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --serif:"Source Serif 4",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink)}
body{color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:var(--fg)} @media (hover:hover){a:hover{color:var(--red)}}
header.top a,.seg,.tile,.un-card,.issues a,.past-tease{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;text-decoration:none;color:var(--fg)}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(26px,3.2vw,34px);line-height:1;letter-spacing:-.5px}
.logo b{color:var(--red)}
.brand:hover,.brand:active{color:var(--fg)}
.issue-tag{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.7vw,18px);color:var(--fg-soft)}
.howto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:4px 0 22px;padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.howto b{font-family:var(--display);font-weight:900;font-size:clamp(18px,2.2vw,22px)}
.howto ol{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:14px;color:var(--fg-soft)}
.howto li span{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:6px;border-radius:50%;background:var(--red-deep);color:var(--fg);font-weight:800;font-size:12px}
nav.main{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.seg a,.navlink{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;font-weight:700;font-size:12px;letter-spacing:1.5px;color:var(--muted)}
.seg a[aria-current="page"]{background:var(--fg);color:var(--ink)}
.navlink[aria-current="page"]{color:var(--fg)}
.sub{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:1px;color:var(--fg);background:var(--red-deep);box-shadow:0 4px 0 #4a0f0a}
@media (hover:hover){.sub:hover{color:var(--fg);background:#B8301F}}
@media (max-width:640px){
  .bar{gap:6px;padding-block:8px 7px}
  .brand{flex-wrap:nowrap;gap:8px;min-width:0;width:100%}
  .logo{font-size:24px}
  .issue-tag{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  nav.main{width:100%;flex-wrap:nowrap;justify-content:space-between;gap:4px}
  .seg{padding:2px}
  .seg a,.navlink{min-height:32px;padding:0 10px;font-size:10px;letter-spacing:.8px;white-space:nowrap}
  .sub{white-space:nowrap}
  .navlink{padding:0 4px}
  .sub{min-height:32px;padding:0 12px;font-size:10.5px;letter-spacing:.8px;box-shadow:0 3px 0 #4a0f0a}
}
main{padding-block:20px 64px}
/* masthead + cover */
.masthead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-block:6px 14px;border-bottom:3px double var(--line);margin-bottom:20px}
.masthead p{margin:0;font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.masthead .tag{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0;text-transform:none;color:var(--fg-soft)}
.cover{margin:0;border-radius:18px;overflow:hidden;box-shadow:0 10px 0 #000,0 30px 60px rgba(0,0,0,.6);max-width:100%}
.cover img{display:block;width:100%;height:auto}
.cover a{background:#000}
@media (min-width:700px){.cover.tall a{height:min(60vh,560px)}.cover.tall img{height:100%;object-fit:contain}}
.coverlines{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.coverlines{grid-template-columns:repeat(2,minmax(0,1fr))}}
.coverlines a{display:flex;flex-direction:column;gap:6px;height:100%;box-sizing:border-box;padding:14px 16px;border-top:3px solid var(--red);background:var(--panel);border-radius:0 0 12px 12px;text-decoration:none;color:var(--fg)}
.coverlines span{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted)}
.coverlines b{font-family:var(--display);font-weight:800;font-size:clamp(16px,1.8vw,21px);line-height:1.2;text-wrap:balance}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;margin:44px 0 18px}
.section-head h2{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(28px,4vw,44px);line-height:1.05}
.section-head p{margin:0;font-size:14px;color:var(--muted);max-width:52ch}
.hero{display:flex;flex-direction:column;gap:10px;margin-block:8px 28px;max-width:760px}
.eyebrow{margin:0;font-weight:700;font-size:12px;letter-spacing:3px;color:var(--red);text-transform:uppercase}
.hero h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,72px);line-height:1;letter-spacing:-1px}
.hero p{margin:0;font-size:18px;color:var(--fg-soft);max-width:60ch}
/* grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;list-style:none;margin:0;padding:0}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.tile{container-type:inline-size;position:relative;aspect-ratio:1/1;max-width:100%;box-sizing:border-box;padding:clamp(11px,6cqi,20px);display:flex;flex-direction:column;gap:8px;border-radius:16px;border:1px solid var(--line);
  background:var(--panel);overflow:hidden;box-shadow:0 6px 0 #000,0 18px 30px rgba(0,0,0,.45);transition:transform .18s ease,box-shadow .18s ease}
@media (hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:0 9px 0 #000,0 24px 36px rgba(0,0,0,.55)}}
.tile.has-img{background-size:cover;background-position:center 30%}
.tile.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.92) 100%)}
.tile > *{position:relative}
.tile.top{border:2px solid var(--fg)}
.tile.top:not(.has-img){background:var(--fg);color:var(--ink)}
.tile.top:not(.has-img) .dek{color:#3A3A40}
.tile.top:not(.has-img) .label{background:var(--ink);color:var(--fg)}
.tile.top:not(.has-img) .rank{color:var(--red-deep)}
.tile.top:not(.has-img) h2 a{color:var(--ink)}
.tile.top:not(.has-img) .vote{background:rgba(0,0,0,.08)}
.tile.top:not(.has-img) .vote button{color:var(--ink);background:rgba(0,0,0,.08)}
.tile-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rank{font-family:var(--display);font-weight:900;font-size:clamp(22px,12cqi,40px);line-height:1;color:var(--red);font-variant-numeric:tabular-nums lining-nums}
.label{font-weight:800;font-size:clamp(10px,4.6cqi,14px);letter-spacing:.12em;line-height:1.15;text-align:right;color:var(--ink);background:var(--fg);padding:.35em .6em;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.35);max-width:70%}
.feat{align-self:flex-start;font-weight:700;font-size:10px;letter-spacing:2px;padding:4px 9px;border-radius:999px;background:var(--red-deep);color:var(--fg)}
.tile h2{margin:0;margin-top:auto;font-family:var(--display);font-weight:800;font-size:clamp(18px,11cqi,38px);line-height:1.08;text-shadow:0 2px 12px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.tile h2 a{color:var(--fg);text-decoration:none}
.tile{cursor:pointer}
.dek{margin:0;font-size:clamp(12px,4.6cqi,15px);line-height:1.45;color:var(--fg-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.read{font-weight:700;font-size:12px;letter-spacing:1.5px;color:inherit;opacity:.8}
.vote{display:flex;align-items:center;gap:4px;padding:3px;border-radius:14px;background:rgba(0,0,0,.45)}
.vote button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:11px;cursor:pointer;color:var(--fg);background:rgba(255,255,255,.10);transition:transform .1s ease}
.vote button:active{transform:translateY(2px)}
.vote button.up[aria-pressed="true"]{background:var(--red);color:var(--fg)}
.vote button.down[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.score{min-width:30px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:820px){
  .tile{gap:5px;border-radius:14px}
  .dek,.read,.feat{display:none}
  .vote{width:100%;justify-content:space-between;padding:2px}
  .tile{padding:10px;gap:4px}
  .tile-foot{justify-content:flex-end}
  .tile .vote{width:72%;justify-content:space-between;gap:6px;padding:3px 3px 3px 12px;border-radius:12px;background:rgba(0,0,0,.6);flex-direction:row-reverse}
  .tile .vote button{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16)}
  .tile .vote button svg{width:19px;height:19px;stroke-width:3}
  .tile .score{min-width:16px;font-size:15px;text-align:left}
  .tile h2{font-size:clamp(18px,12.8cqi,29px);line-height:1.06;-webkit-line-clamp:4;letter-spacing:-.01em}
  .rank{font-size:clamp(18px,11cqi,28px)}
  .tile > .feat-band{height:16px;font-size:8px;letter-spacing:.3em}
  .tile:has(.feat-band){padding-bottom:20px}
  .tile h2{flex-shrink:0}
  .tile:has(.feat-band) h2{-webkit-line-clamp:3}
  .label{font-size:clamp(8.5px,5cqi,11px);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78%;padding:.35em .5em}
}
/* article */
.article{max-width:740px;margin:0 auto}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:700;font-size:13px;letter-spacing:1px;text-decoration:none;color:var(--muted)}
.art-head{display:flex;flex-direction:column;gap:14px;margin-block:10px 28px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.art-label{font-weight:700;font-size:13px;letter-spacing:2.5px;color:var(--red)}
.art-head h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(32px,5.4vw,56px);line-height:1.04;letter-spacing:-.5px;text-wrap:balance}
.art-dek{margin:0;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.45;color:var(--fg-soft)}
.byline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.byline p{margin:0;font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--muted)}
.byline b{color:var(--fg)}
.art-hero{margin:0 0 28px;border-radius:14px;overflow:hidden}
.art-hero img{display:block;width:100%;height:auto}
.prose{display:flex;flex-direction:column;gap:18px;font-family:var(--serif);font-size:19px;line-height:1.7;color:#ECECEF;max-width:68ch}
.prose p{margin:0}
.prose p.lead::first-letter{float:left;font-family:var(--display);font-weight:900;font-size:4.2em;line-height:.82;padding:6px 10px 0 0;color:var(--red)}
.prose h3{margin:18px 0 0;font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:2.5px;text-transform:uppercase;color:var(--fg)}
.prose blockquote{margin:0;padding:20px 24px;border-radius:12px;background:#26262B;border:1px solid #34343A;font-style:italic;color:var(--fg)}
.prose blockquote .q-cite{display:block;margin-top:12px;font-family:var(--sans);font-style:normal;font-size:14px;font-weight:700;color:var(--muted)}
.prose .cite{margin-top:-8px;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--muted)}
.prose .cap{font-family:var(--sans);font-size:14px;color:var(--muted)}
.prose ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.prose a{color:var(--fg);text-decoration-color:var(--red);text-underline-offset:3px;overflow-wrap:anywhere}
.prose strong{font-family:var(--sans);font-size:.85em;letter-spacing:.5px}
.pull{margin:14px 0;padding:22px 0;border-top:3px solid var(--red);border-bottom:1px solid var(--line);font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(24px,3.4vw,32px);line-height:1.25;color:var(--fg);text-wrap:balance}
.fig{margin:6px 0;display:flex;flex-direction:column;gap:8px}
.fig .frame{display:block;position:relative;border-radius:12px;overflow:hidden;background:var(--panel);max-width:100%}
.fig img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#000}
.fig figcaption{font-family:var(--sans);font-size:13.5px;color:var(--muted)}
.fig .badge{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.75);font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:1.5px;color:var(--fg);text-decoration:none}
.media{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:12px;border:1px dashed var(--line);font-family:var(--sans);color:var(--fg-soft);font-size:15px}
.media strong{font-size:11px;letter-spacing:2px;color:var(--red)}
.sign{font-family:var(--display);font-style:italic;font-weight:700;font-size:24px;color:var(--fg)}
.pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;background:var(--panel);text-decoration:none;color:var(--fg);min-width:0}
.pager a span{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted)}
.pager a b{font-family:var(--display);font-size:16px;font-weight:800;line-height:1.25}
.pager .next{text-align:right}
.notes-link{display:flex;flex-direction:column;gap:4px;margin-top:28px;padding:18px 20px;border-radius:14px;border:1px dashed var(--line);text-decoration:none;color:var(--fg)}
.notes-link span{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--red)}
.notes-link b{font-family:var(--display);font-weight:800;font-size:clamp(17px,2vw,21px)}
.notes .note{display:flex;flex-direction:column;gap:12px;padding-block:6px 18px;border-bottom:1px solid var(--line)}
.notes .note:last-child{border-bottom:0}
.car .track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.car .slide{flex:0 0 min(82%,420px);scroll-snap-align:start;margin:0}
.car .slide img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:10px}
.car .ctrl{display:flex;align-items:center;gap:14px;margin-top:10px;font-family:var(--sans);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.car .rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--red);background:none;color:var(--red);font-size:20px;line-height:1;cursor:pointer}
@media (hover:hover){.car .rb:hover{background:rgba(224,72,59,.15)}}
.car .ctrl .cc{margin-left:auto}
.car .slide{cursor:zoom-in}
.lbx{position:fixed;inset:0;z-index:50;background:#060607;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:#fff}
.lbx-top{display:flex;justify-content:space-between;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums}
.lbx-close{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;font:600 13px var(--sans);padding:7px 16px;cursor:pointer}
.lbx-stage{position:relative;min-height:0;padding:0 64px}
.lbx-strip{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.lbx-strip::-webkit-scrollbar{display:none}
.lbx-slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center;padding:0 8px;box-sizing:border-box}
.lbx-slide img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lbx-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.5);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.lbx-nav.p{left:10px}.lbx-nav.n{right:10px}
.lbx-hint{padding:10px 16px 16px;text-align:center;font-family:var(--sans);font-size:13px;color:#aaa}
@media (max-width:640px){.lbx-stage{padding:0}.lbx-nav{display:none}}
.pair{display:flex;gap:10px;align-items:flex-start}
.pair img{display:block;flex:1 1 0;min-width:0;width:100%;height:auto;border-radius:12px}
.fig.gif .frame{max-width:320px;margin:0 auto;background:transparent}
.fig.gif img{max-height:none;background:transparent}
.float-vote{position:fixed;z-index:6;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:999px;background:rgba(21,21,23,.94);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.float-vote .fv-label{font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg-soft)}
.float-vote .vote{background:transparent;padding:0}
@media (max-width:640px){
  .float-vote{gap:6px;padding:3px 3px 3px 11px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  .float-vote .fv-label{font-size:10px;letter-spacing:1.2px}
  .float-vote .vote button{width:34px;height:34px;border-radius:9px}
  .float-vote .vote button svg{width:16px;height:16px}
  .float-vote .score{min-width:22px;font-size:14px}
  .prose{font-size:20.5px;line-height:1.65}
}
.comments{max-width:68ch;margin-top:40px;padding-top:24px;border-top:3px solid var(--red);display:flex;flex-direction:column;gap:16px}
.comments h2{margin:0;font-family:var(--display);font-weight:900;font-size:28px}
.comments h2 span{font-family:var(--sans);font-size:16px;color:var(--muted)}
.c-form{display:flex;flex-direction:column;gap:8px}
.c-label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.c-form textarea{width:100%;box-sizing:border-box;min-height:90px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:16px/1.5 var(--sans);resize:vertical}

<script>
const BLOKS = __DATA__;
const IMG = __IMAGES__;
const ISSUE = 7;
const COVERLINES = ["chain-reaction","newsfeed","must-see","now-playing"];
const COVERTEXT = {"chain-reaction":"The Bitcoin Crowd Lost the Plot","newsfeed":"Should We Talk About Lindsay Clancy?","must-see":"Maeve Halligan Swims Upstream","now-playing":"Prada 2 and the Hidden Cost"};
const PAST = [
  {n:7,t:"Retail Mindset",d:"Oct 28, 2026",here:true,img:"cover"},
  {n:6,t:"Do you have what it takes to be early?",d:"Apr 24, 2026",img:"issue6",href:"https://lennylesser.beehiiv.com/p/6-do-you-have-what-it-takes-to-be-early"},
  {n:5,t:"Chaos is a Ladder",d:"Mar 13, 2026",img:"issue5",href:"https://lennylesser.beehiiv.com/p/issue-5-chaos-is-a-ladder"},
  {n:4,t:"Cold Water",d:"Feb 4, 2026",img:"issue4",href:"https://lennylesser.beehiiv.com/p/issue-4-cold-water"},
  {n:3,t:"Find Your Edge",d:"Jan 3, 2026",img:"issue3",href:"https://lennylesser.beehiiv.com/p/issue-3-find-your-edge"},
  {n:2,t:"How May I Help You?",d:"Nov 28, 2025",img:"issue2",href:"https://lennylesser.beehiiv.com/p/issue-2-how-may-i-help-you"},
  {n:1,t:"About Last Week",d:"Oct 29, 2025",img:"issue1",href:"https://lennylesser.beehiiv.com/p/about-last-week-issue-1-08fd"}
];
const LABELS = ["What it does:","The bigger shift:","The catch:","Takeaway:","Tools:","People are using it for:"];
const NEWSLETTER = "https://lennylesser.beehiiv.com";
const SURVEY = "https://docs.google.com/forms/d/e/1FAIpQLSedWziqsIQfv9bfBojwvFmpzItweprLQQ5XhsjvmwnBg62P3w/viewform";

/* ---------- votes: shared through db when available, else this browser only ---------- */
let tallies = {}, mine = {}, shared = false, uid = null, votesCol = null, DB = null, USER = null, commentsCol = null;
function lsGet(){ try{ return JSON.parse(localStorage.getItem("blok20-votes-"+ISSUE)||"{}"); }catch(e){ return {}; } }
function lsSet(v){ try{ localStorage.setItem("blok20-votes-"+ISSUE, JSON.stringify(v)); }catch(e){} }
mine = lsGet(); for (const k in mine){ if (mine[k]===1) tallies[k] = (tallies[k]||0) + 1; else delete mine[k]; }

async function connect(){
  if (!window.claude || !window.claude.use) return;
  try{
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    uid = await user.id();
    if (!uid) return;
    DB = db; USER = user; commentsCol = db.collection("comments");
    renderComments();
    votesCol = db.collection("votes");
    votesCol.where("issue","==",ISSUE).onSnapshot(snap => {
      shared = true; const t = {}, m = {};
      snap.docs.forEach(d => { const v = d.data(); if (!v) return;
        if (v.dir !== 1) return;
        t[v.blok] = (t[v.blok]||0) + 1;
        if (v.voter === uid) m[v.blok] = 1; });
      tallies = t; mine = m; refresh();
    }, () => { shared = false; refresh(); });
  }catch(e){}
}
async function vote(id, dir){
  const prev = mine[id]||0, next = prev===dir ? 0 : dir;
  mine = {...mine}; if (next) mine[id]=next; else delete mine[id];
  tallies = {...tallies, [id]:(tallies[id]||0) - prev + next};
  refresh();
  if (shared && votesCol && uid){
    const ref = votesCol.doc(("i"+ISSUE+"-"+id+"-"+uid).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_"));
    try{ next ? await ref.set({issue:ISSUE, blok:id, dir:next, voter:uid}) : await ref.delete(); }catch(e){}
  } else { lsSet(mine); }
}

/* ---------- helpers ---------- */
const el = (tag, attrs={}, ...kids) => { const n=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){ if(v==null) continue;
    if(k==="class") n.className=v; else if(k==="text") n.textContent=v; else if(k==="style") n.setAttribute("style",v); else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else n.setAttribute(k,v); }
  kids.flat().forEach(c => c!=null && n.append(c)); return n; };
const NS="http://www.w3.org/2000/svg";
const icon = (d, filled) => { const s=document.createElementNS(NS,"svg");
  [["width","20"],["height","20"],["viewBox","0 0 24 24"],["fill",filled?"currentColor":"none"],["stroke","currentColor"],["stroke-width","2.5"],["stroke-linecap","round"],["stroke-linejoin","round"],["aria-hidden","true"]].forEach(([k,v])=>s.setAttribute(k,v));
  const p=document.createElementNS(NS,"path");p.setAttribute("d",d);s.append(p);return s; };
function ranked(){ return BLOKS.map((b,i)=>({...b,i,score:tallies[b.id]||0})).sort((a,b)=>(b.score-a.score)||(a.i-b.i)); }
function voteBox(b){
  const my = mine[b.id]||0;
  return el("div",{class:"vote","data-blok":b.id},
    el("button",{type:"button",class:"up","data-vote":b.id+":1","aria-label":"Uprate "+b.name,"aria-pressed":String(my===1),onclick:e=>{e.preventDefault();vote(b.id,1);}},icon("M6 15l6-6 6 6")),
    el("span",{class:"score",text:String(tallies[b.id]||0)}));
}
/* refresh votes in place on article pages so typing in comments isn't lost */
function curRoute(){ return (location.hash||"").replace(/^#/,"") || "this-week"; }
function refresh(){
  const blok = BLOKS.find(b=>b.id===curRoute());
  if (!blok){ render(true); return; }
  document.querySelectorAll('.vote[data-blok]').forEach(v=>{
    const id=v.dataset.blok, on=(mine[id]||0)===1;
    v.querySelector("button.up").setAttribute("aria-pressed",String(on));
    v.querySelector(".score").textContent=String(tallies[id]||0);
  });
}
/* ---------- comments ---------- */
let commentsUnsub = null, commentsFor = null, commentDocs = [], names = {};
function fmtWhen(ms){ try{ return new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }catch(e){ return ""; } }
async function resolveNames(){
  if (!USER) return;
  const ids=[...new Set(commentDocs.map(c=>c.author).filter(Boolean))];
  if (!ids.length) return;
  try{ const ps = await USER.profiles(ids); ids.forEach(id=>{ names[id]=(ps[id]&&ps[id].name)||"Someone"; }); }catch(e){}
  drawComments();
}
function subscribeComments(blokId){
  if (commentsFor===blokId || !commentsCol) return;
  if (commentsUnsub) commentsUnsub();
  commentsFor=blokId; commentDocs=[];
  commentsUnsub = commentsCol.where("blok","==",blokId).onSnapshot(snap=>{
    commentDocs = snap.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.issue===ISSUE).sort((a,b)=>(a.at||0)-(b.at||0));
    drawComments(); resolveNames();
  }, ()=>{ commentDocs=[]; drawComments(); });
}
function drawComments(){
  const list=document.getElementById("comment-list"); if (!list) return;
  const head=document.getElementById("comment-count"); if (head) head.textContent = commentDocs.length ? "("+commentDocs.length+")" : "";
  if (!commentDocs.length){ list.replaceChildren(el("p",{class:"c-empty",text:"No comments yet. Start the conversation."})); return; }
  list.replaceChildren(...commentDocs.map(c=> el("li",{class:"c-item"},
    el("div",{class:"c-meta"}, el("b",{text: c.author===uid ? "You" : (names[c.author]||"Someone")}), el("span",{text:fmtWhen(c.at)}),
      c.author===uid ? el("button",{type:"button",class:"c-del","aria-label":"Delete your comment",onclick:()=>{ commentsCol.doc(c.id).delete().catch(()=>{}); }},"Delete") : null),
    el("p",{class:"c-text",text:c.text||""}))));
}
function renderComments(){
  const blok = BLOKS.find(b=>b.id===curRoute());
  if (blok && commentsCol){ commentsFor=null; subscribeComments(blok.id); }
  const form=document.getElementById("comment-form"), note=document.getElementById("comment-note");
  if (form) form.hidden = !commentsCol;
  if (note) note.hidden = !!commentsCol;
}
function commentsSection(b){
  const ta = el("textarea",{id:"comment-text",name:"comment",rows:"3",maxlength:"600",placeholder:"Add your take…",required:"required"});
  const form = el("form",{id:"comment-form",class:"c-form",onsubmit:async e=>{
      e.preventDefault(); const text=ta.value.trim(); if(!text||!commentsCol) return;
      const btn=form.querySelector("button"); btn.disabled=true;
      try{ await commentsCol.add({issue:ISSUE,blok:b.id,text:text.slice(0,600),author:uid,at:Date.now()}); ta.value=""; }
      catch(err){ const s=document.getElementById("comment-status"); if(s) s.textContent="That didn’t post. Try again in a moment."; }
      btn.disabled=false; }},
    el("label",{for:"comment-text",class:"c-label",text:"Your comment"}), ta,
    el("div",{class:"c-actions"}, el("span",{id:"comment-status",class:"c-status","aria-live":"polite"}), el("button",{type:"submit",class:"c-post"},"Post")));
  form.hidden = !commentsCol;
  return el("section",{class:"comments","aria-labelledby":"c-head"},
    el("h2",{id:"c-head"},"Comments ", el("span",{id:"comment-count"})),
    form,
    el("p",{id:"comment-note",class:"c-empty",hidden: commentsCol? "hidden" : null, text:"Comments load when you open this page signed in."}),
    el("ol",{id:"comment-list",class:"c-list"}));
}
function linkify(text){
  return text.split(/(https?:\/\/\S+)/g).map(p => /^https?:\/\//.test(p) ? el("a",{href:p,target:"_blank",rel:"noopener",text:p}) : document.createTextNode(p));
}
function inlineLinks(nodes, links){
  if(!links||!links.length) return nodes;
  let out=nodes;
  links.forEach(L=>{ const next=[]; out.forEach(n=>{ if(typeof n!=="string"){ next.push(n); return; } const i=n.indexOf(L.text); if(i<0){ next.push(n); return; }
    next.push(n.slice(0,i), el("a",L.href.startsWith("/")?{href:L.href,text:L.text}:{href:L.href,target:"_blank",rel:"noopener",text:L.text}), n.slice(i+L.text.length)); }); out=next; });
  return out;
}
function para(text, lead, links){
  if (links) return el("p",lead?{class:"lead"}:{}, ...inlineLinks([text], links));
  const lab = LABELS.find(l => text.startsWith(l));
  if (lab) return el("p",{}, el("strong",{text:lab}), ...linkify(text.slice(lab.length)));
  return el("p",lead?{class:"lead"}:{}, ...linkify(text));
}
function readTime(b){ const w = b.body.reduce((n,x)=>n+((x.text||"")+(x.items||[]).join(" ")).split(/\s+/).length,0); return Math.max(1,Math.round(w/230)); }

/* ---------- views ---------- */
function tileFor(b, r, all){
  const img = b.img && IMG[b.img];
  return el("li",{class:"tile"+(r===0?" top":"")+(img?" has-img":"")+(b.feature?" is-feat":""), style: img ? "background-image:url('"+img+"')" : null,
      onclick: e => { if (!e.target.closest("button,a")) location.hash = b.id; }},
    el("div",{class:"tile-head"}, el("span",{class:"rank",text:String(r+1).padStart(2,"0")}), el("span",{class:"label",text:(all?"ISSUE 7 · ":"")+b.name})),

    el("h2",{}, el("a",{href:"#"+b.id,text:b.title})),
    el("div",{class:"tile-foot"}, el("span",{class:"read",text:"READ →"}), voteBox(b)),
    b.feature ? el("span",{class:"feat-band",text:"FEATURE"}) : null);
}
function gridView(all){
  const list = ranked();
  const grid = el("ol",{class:"grid","aria-label": all?"All-time ranking":"This week’s bloks, ranked"}, list.map((b,r)=>tileFor(b,r,all)));
  if (all) return [el("section",{class:"hero"}, el("p",{class:"eyebrow",text:"Experiment · every issue"}), el("h1",{text:"All-Time"}),
      el("p",{text:"The most uprated pieces across every issue. Issue 7 is the first one counted."})), grid];
  const byId = Object.fromEntries(BLOKS.map(b=>[b.id,b]));
  return [
    el("section",{class:"howto","aria-label":"How 20 Blok works"}, el("b",{text:"New stories every week. You pick the winners."}),
      el("ol",{}, el("li",{}, el("span",{text:"1"}),"Read the bloks"), el("li",{}, el("span",{text:"2"}),"Uprate your favorites"), el("li",{}, el("span",{text:"3"}),"The top blok takes the #1 spot"))),
    el("div",{class:"masthead"}, el("p",{text:"Issue 7 · October 2026 · Edited by Lenny Lesser"}), el("p",{class:"tag",text:"Retail Mindset"})),
    el("figure",{class:"cover"}, el("a",{href:"#straight-up","aria-label":"Read Retail Mindset, the editor’s letter",style:"display:block"}, el("img",{src:IMG.cover,alt:"Issue 7 cover: Retail Mindset. Shoppers push carts down aisles stocked with headlines, charts and opinions. Are your opinions actually yours?"}))),
    el("ul",{class:"coverlines","aria-label":"Cover stories"}, COVERLINES.map(id=> el("li",{}, el("a",{href:"#"+id}, el("span",{text:byId[id].name}), el("b",{text:COVERTEXT[id]}))))),
    el("div",{class:"section-head"}, el("h2",{text:"The Grid"}),
      el("p",{text: (shared ? "Ranked live by readers. " : "Ranked by readers. ") + "Uprate what you want more of. The most uprated blok sits top-left; ties keep the table of contents order."})),
    grid,
    el("section",{class:"feedback","aria-labelledby":"fb-head"},
