name: beehiiv-fetch
on:
  push:
    branches: [beehiiv-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published Beehiiv posts (HTML) for the backfill
        run: |
          mkdir -p beehiiv_raw
          for slug in issue-5-chaos-is-a-ladder issue-4-cold-water issue-3-find-your-edge issue-2-how-may-i-help-you about-last-week-issue-1-08fd; do
            curl -sL -A "Mozilla/5.0" "https://lennylesser.beehiiv.com/p/$slug" -o "beehiiv_raw/$slug.html"
            echo "$slug $(wc -c < beehiiv_raw/$slug.html)"
          done
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add beehiiv_raw && git commit -m "raw beehiiv html [skip ci]" && git push
