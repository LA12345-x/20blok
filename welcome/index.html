const ARCHIVE = {"5": {"n": 5, "title": "Chaos Is a Ladder", "date": "Mar 13, 2026", "month": "March 2026", "pub": "2026-03-13", "cover": "i5_cover", "cover_alt": "Issue 5 cover: Chaos Is a Ladder. A man in a suit climbs a narrow ladder up a tall brick wall.", "remote_images": {"chaos": "https://media2.giphy.com/media/sRLh6rjD3Kn8D7YVSK/giphy.gif"}, "coverlines": ["issue-5/must-see", "issue-5/industry-freeks", "issue-5/word-meme", "issue-5/chain-reaction"], "covertext": {"issue-5/must-see": "will.i.am Makes the AI Music Case at Davos", "issue-5/industry-freeks": "UMG Swallows Downtown Music", "issue-5/word-meme": "F Elon: A Historic Bait and Switch", "issue-5/chain-reaction": "Crypto State of the Union"}, "notes": {"signoff": "Thanks for reading Issue 5. If you got something out of it, share it with someone who would too.", "link_text": "the sign-off, editor notes and the treasure hunt answer →", "treasure": {"text": "This issue’s icon was hiding in NOW PLAYING: a reference to Portishead’s “Glory Box,” covered in Snowpiercer. Here’s the original.", "video": {"href": "https://www.youtube.com/watch?v=4qQyUi4zfDs", "cap": "Portishead: Glory Box. Watch on YouTube."}, "back": {"label": "← Back to NOW PLAYING", "href": "/issue-5/now-playing"}}, "editor_notes": [{"text": "Feature tags: the word FEATURE now marks the pieces chosen as features, so you know ahead of time."}, {"text": "🗺️ Treasure Hunt is back! Spot the icon hidden somewhere in the issue and follow it to the answer, where the original source or reference is waiting for you."}, {"text": "The Kuminga Update 🏀: Called it in last issue. The Warriors traded him to Atlanta, he dropped 27 points in his first game, and you could see the difference immediately. It was never a player problem, just bad management.", "links": [{"text": "in last issue", "href": "https://lennylesser.beehiiv.com/p/issue-4-cold-water#behind-the-reel"}, {"text": "traded", "href": "https://www.nba.com/hawks/news/atlanta-hawks-acquire-buddy-hield-and-jonathan-kuminga-from-golden-state"}]}], "alpha": "“Your direction is more important than your speed.”", "footnote": {"text": "¹ Book reference: “In the Blink of an Eye” by Walter Murch.", "links": [{"text": "“In the Blink of an Eye” by Walter Murch", "href": "https://web.arch.virginia.edu/arch545/handouts/pdfmurch/murch_excerpt.pdf"}]}}, "bloks": [{"id": "issue-5/straight-up", "name": "STRAIGHT UP", "emoji": "🎙️", "feature": false, "editor": true, "title": "Chaos Is a Ladder", "dek": "Before you climb anything, know your emotional triggers.", "img": "i5_cover", "tags": ["Mindset"], "people": ["Walter Murch"], "body": [{"t": "p", "text": "Chaos is a ladder — but before you climb anything, know your emotional triggers."}, {"t": "p", "text": "When you swim with chaos rather than fight it, you minimize how much of it gets to you."}, {"t": "q", "text": "“Cut out the bad bits.”"}, {"t": "cite", "text": "—Walter Murch"}, {"t": "p", "text": "The hard part? No one cheers you on when you make the preventative, composed choice."}, {"t": "p", "text": "In fact, the applause tends to go the other way — toward outbursts, gossip, and emotional performance, misreading attention as growth."}, {"t": "img", "src": "i5_chaos", "cap": "Popularized in Game of Thrones.", "alt": "“Chaos is a ladder” GIF from Game of Thrones", "gif": true}, {"t": "p", "text": "Film editor Walter Murch once described the editing process simply: “Cut out the bad bits.”¹", "links": [{"text": "Walter Murch", "href": "https://web.arch.virginia.edu/arch545/handouts/pdfmurch/murch_excerpt.pdf"}]}, {"t": "p", "text": "Do that — honest self-editing — and you become comfortable in chaos, patiently finding opportunities instead of reacting to nonsensical noise."}, {"t": "cap", "text": "¹ Book reference: “In the Blink of an Eye” by Walter Murch."}], "slug": "straight-up", "links": [], "media": "", "seo_title": "Chaos Is a Ladder — Walter Murch | 20 Blok"}, {"id": "issue-5/must-see", "name": "MUST-SEE", "emoji": "👁️", "feature": false, "title": "Will.i.am on AI Music at Davos", "dek": "A nuanced AI music take, in front of the world’s elite.", "img": "i5_yt_sSiaB90XpII", "tags": ["AI", "Music"], "people": ["will.i.am"], "body": [{"t": "p", "text": "Will.i.am walked into Davos — the annual gathering of the world’s financial and political elite — and made the case for AI in music without flinching, and without throwing anyone under the bus."}, {"t": "img", "src": "i5_yt_sSiaB90XpII", "cap": "will.i.am on AI and music at Davos. Watch on YouTube.", "alt": "will.i.am on AI and music at Davos", "href": "https://www.youtube.com/watch?v=sSiaB90XpII", "badge": "WATCH ON YOUTUBE"}], "slug": "must-see", "links": [], "media": "", "seo_title": "Will.i.am on AI Music at Davos | 20 Blok"}, {"id": "issue-5/industry-freeks", "name": "INDUSTRY FREEKS", "emoji": "🧪", "feature": false, "title": "I Guess Monopolies Are Fine Now 🤷‍♂️", "dek": "UMG swallows Downtown Music, and indies took a hit.", "img": "i5_yt_-DSAMdm-Zhw", "tags": ["Music", "News"], "people": ["Miss Krystle"], "body": [{"t": "p", "text": "She goes by Miss Krystle — lawyer, YouTuber, and musician — and she’s out here fighting for the little guy/girl."}, {"t": "img", "src": "i5_yt_-DSAMdm-Zhw", "cap": "Miss Krystle on UMG and Downtown Music. Watch on YouTube.", "alt": "Miss Krystle: Indie artists beware", "href": "https://www.youtube.com/watch?v=-DSAMdm-Zhw", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "In this video she breaks down Universal Music Group’s acquisition of Downtown Music Holdings, a $775 million deal that just closed last month after a lengthy regulatory battle with the European Commission."}, {"t": "p", "text": "The EU approved it — but only after forcing UMG to spin off Curve, Downtown’s royalty and rights-management platform, which gave them access to sensitive data from hundreds of independent labels."}, {"t": "p", "text": "Downtown’s catalog includes CD Baby, FUGA, and Songtrust. UMG is already the largest record label on the planet. You do the math."}, {"t": "p", "text": "Miss Krystle does it for you."}, {"t": "link", "label": "🎥 On YouTube: @TopMusicAttorney →", "href": "https://www.youtube.com/@TopMusicAttorney"}], "slug": "industry-freeks", "links": [], "media": "", "seo_title": "I Guess Monopolies Are Fine Now 🤷‍♂️ — Miss Krystle | 20 Blok"}, {"id": "issue-5/word-meme", "name": "WORD MEME", "emoji": "🗿", "feature": true, "title": "F Elon: A Historic Bait and Switch", "dek": "The bait-and-switch, perfectly crystallized.", "img": "i5_felon_poster", "tags": ["Memes", "Culture", "Internet Culture"], "people": ["Elon Musk"], "body": [{"t": "p", "text": "Elon Musk, just in general, is kind of cringe."}, {"t": "p", "text": "I mean that in the most observational way possible — because he’s also the kind of character that will probably get chiseled into a mountain somewhere. That’s what makes him interesting to study."}, {"t": "p", "text": "The “F Elon” meme didn’t come from nowhere. It was born out of a very specific bait-and-switch — an ideological one."}, {"t": "p", "text": "Tesla was sold, consciously or not, as a certain kind of product for a certain kind of person. Clean energy. Innovation. A better future. A lot of people bought in — literally, by way of cars and unprecedented brand loyalty."}, {"t": "p", "text": "Then the curtain pulled back."}, {"t": "img", "src": "i5_felon_shirt", "cap": "", "alt": "A black T-shirt mockup reading F ELON over a starship graphic.", "narrow": true}, {"t": "p", "text": "What you actually got was: a chosen technocrat, the new Steve Jobs (his words, essentially), a 14-kid-having, DOGE-leading, SpaceX-and-Tesla-running character who it turns out was never the progressive green-tech savior anyone projected onto him."}, {"t": "p", "text": "He was always something else. The projection was the problem."}, {"t": "p", "text": "And now the cope is in full form."}, {"t": "p", "text": "The “I bought this before Elon went crazy” bumper sticker is one of the more honest artifacts of recent cultural history. It’s an apology and a disclaimer at the same time. A little white flag stuck to the back of a $50,000 car."}, {"t": "img", "src": "i5_bumper", "cap": "", "alt": "Bumper sticker: I bought this before Elon went crazy.", "narrow": true}, {"t": "p", "text": "No offense — genuinely — but this is a learning moment for everyone. You can drink the Kool-Aid on a brand, a person, a movement, without ever really looking underneath. And when the floor drops, the surprise feels personal."}, {"t": "p", "text": "Maybe it’s just the old “never meet your heroes” rule — or maybe it’s what happens when you let marketing campaigns do the work that research was supposed to do."}, {"t": "p", "text": "Enter: F Elon."}, {"t": "p", "text": "First spotted — by me — as a bumper sticker in a sci-fi, Blade Runner-adjacent font: clean, aggressive, and committed."}, {"t": "img", "src": "i5_felon_sticker", "cap": "", "alt": "The F ELON bumper sticker in a sci-fi font.", "narrow": true}, {"t": "p", "text": "There’s the obvious read. Then there’s the second layer: felon — an individual found guilty of a felony offense. Whether that second meaning is intentional or just an extremely fortunate accident of language, it doesn’t matter. The meme works because both meanings land simultaneously."}, {"t": "p", "text": "I made clothing mockups, an original video, and a song inspired by this moment in history. Enjoy."}, {"t": "img", "src": "i5_yt_M8YkaUdUq68", "cap": "The “F Elon”-inspired reel. Watch on YouTube.", "alt": "The F Elon inspired reel", "href": "https://www.youtube.com/watch?v=M8YkaUdUq68", "badge": "WATCH ON YOUTUBE"}, {"t": "img", "src": "i5_felon_poster", "cap": "F Elon movie poster", "alt": "Movie-style poster: F ELON, with Elon Musk smoking under a giant F.", "narrow": true}, {"t": "pull", "text": "Memes capture group sentiments."}], "slug": "word-meme", "links": [], "media": "", "seo_title": "F Elon: A Historic Bait and Switch | 20 Blok"}, {"id": "issue-5/toolz", "name": "TOOLZ", "emoji": "🤖", "feature": false, "title": "Natalia Kalinska’s Content Creator Cheat Code", "dek": "Canva and content strategy, broken down into clear terms.", "img": "i5_yt_Ryv4Q1qmxHs", "tags": ["AI Tools", "Creativity"], "people": ["Natalia Kalinska"], "body": [{"t": "img", "src": "i5_yt_Ryv4Q1qmxHs", "cap": "Natalia Kalinska: complete Canva tutorial. Watch on YouTube.", "alt": "Natalia Kalinska: complete Canva tutorial for beginners", "href": "https://www.youtube.com/watch?v=Ryv4Q1qmxHs", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "What she does: Natalia Kalinska is a YouTube educator with 193K subscribers who breaks down content creation, social media strategy, and Canva into clear terms."}, {"t": "p", "text": "People are using it for:"}, {"t": "ul", "items": ["Building a repeatable content system from scratch", "Learning Canva properly instead of just winging it", "Getting a real marketing strategy without paying for a course"]}, {"t": "p", "text": "The bigger shift: Content creation has a skills gap problem. Most people know they need to show up online — they just don’t know how. Natalia closes that gap."}, {"t": "link", "label": "🎥 On YouTube: @NataliaKalinska →", "href": "https://www.youtube.com/@NataliaKalinska"}], "slug": "toolz", "links": [], "media": "", "seo_title": "Natalia Kalinska’s Content Creator Cheat Code | 20 Blok"}, {"id": "issue-5/behind-the-reel", "name": "BEHIND THE REEL", "emoji": "🎞️", "feature": false, "title": "Rejection Rarely Looks This Good", "dek": "A comedic sketch built entirely with AI.", "img": "i5_yt_LwHYZv3WHR0", "tags": ["AI", "AI Filmmaking", "Comedy"], "people": ["Unruly Reels"], "body": [{"t": "img", "src": "i5_yt_LwHYZv3WHR0", "cap": "End the Madness, an Unruly Reels sketch. Watch on YouTube.", "alt": "End the Madness, an AI-made comedic sketch", "href": "https://www.youtube.com/watch?v=LwHYZv3WHR0", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "End the Madness is a short comedic sketch built entirely with AI — script, audio, video, and music — that turns a universally awkward professional moment into a promo for Unruly Reels, an all-AI advertising production house."}, {"t": "p", "text": "No crew. No production budget. No excuses."}, {"t": "p", "text": "Takeaway: The barrier to entry for professional-looking video content is gone. A single person with the right tools can now produce what used to require a full team and a real budget."}, {"t": "p", "text": "Tools: Veo 3 / Final Cut / Suno"}, {"t": "link", "label": "If this is the kind of work your brand needs ➡️ UnrulyReels.com →", "href": "https://unrulyreels.com"}], "slug": "behind-the-reel", "links": [], "media": "", "seo_title": "Rejection Rarely Looks This Good — Unruly Reels | 20 Blok"}, {"id": "issue-5/find-your-edge", "name": "FIND YOUR EDGE", "emoji": "🗡️", "feature": false, "title": "Age Called. He Didn’t Pick Up.", "dek": "At 70, Michael Kish ran the 100m in 13.47 seconds.", "img": "i5_yt_I9EQAGGwS_o", "tags": ["Mindset", "Sports"], "people": ["Michael Kish"], "body": [{"t": "p", "text": "Age comes up a lot — usually from two kinds of people: those under 30 who can’t imagine it yet, and those who’ve already talked themselves into a ceiling."}, {"t": "p", "text": "People use age to judge, qualify, and put you in your proverbial place. Michael Kish didn’t get the memo."}, {"t": "p", "text": "At 70, he ran the 100m at the Penn Relays in 13.47 seconds — faster than the winning time in the 65-and-over division. He pulled away from the gun and never looked back."}, {"t": "pull", "text": "Age is just age. The rest is a story you’re telling yourself."}, {"t": "img", "src": "i5_yt_I9EQAGGwS_o", "cap": "Michael Kish, 70, runs the 100m. Watch on YouTube.", "alt": "Michael Kish, 70, sprinting the 100m", "href": "https://www.youtube.com/watch?v=I9EQAGGwS_o", "badge": "WATCH ON YOUTUBE"}], "slug": "find-your-edge", "links": [], "media": "", "seo_title": "Age Called. He Didn’t Pick Up. — Michael Kish | 20 Blok"}, {"id": "issue-5/underground", "name": "UNDERGROUND", "emoji": "🚇", "feature": false, "title": "I’m Him: Thorb’s “Soprano”", "dek": "Just here keeping it raw. 2025 hip-hop.", "img": "i5_yt_YHD2xZcsHZY", "tags": ["Music", "Hip-Hop"], "people": ["Thorb"], "body": [{"t": "p", "text": "Just here keeping it raw with Thorb’s “Soprano.”"}, {"t": "img", "src": "i5_yt_YHD2xZcsHZY", "cap": "Thorb: Soprano. Listen on YouTube.", "alt": "Thorb: Soprano", "href": "https://www.youtube.com/watch?v=YHD2xZcsHZY", "badge": "LISTEN"}, {"t": "link", "label": "🎧 Also in the Music Flow Collection →", "href": "https://musicflowcollection.com/song/thorb-soprano/"}], "slug": "underground", "links": [], "media": "", "seo_title": "I’m Him: Thorb’s “Soprano” | 20 Blok"}, {"id": "issue-5/dezign-ur-ritual", "name": "DEZIGN UR RITUAL", "emoji": "🫖", "feature": false, "title": "Men’s Fragrance 101", "dek": "Three entry points for the guy who’s never really thought about it.", "img": "i5_yt_gjSoBUWQ6eA", "tags": ["Fragrance", "Style"], "people": [], "body": [{"t": "img", "src": "i5_seinfeld", "cap": "", "alt": "Jerry Seinfeld, serious, GIF", "gif": true}, {"t": "p", "text": "This one’s for the guys who’ve never really thought about it — and for the women who’ve been waiting for their man to figure it out. Feel free to forward this section accordingly."}, {"t": "p", "text": "Fragrance is one of the most underrated tools in a man’s arsenal. It’s invisible, immediate, and says something about you before you even enter the room."}, {"t": "p", "text": "Getting started is easier than it looks."}, {"t": "p", "text": "The video below gives you a solid contextual framework to start navigating it."}, {"t": "img", "src": "i5_yt_gjSoBUWQ6eA", "cap": "A man’s introduction to fragrance. Watch on YouTube.", "alt": "A man’s introduction to fragrance", "href": "https://www.youtube.com/watch?v=gjSoBUWQ6eA", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "Here are three entry points worth knowing:"}, {"t": "h", "text": "1. Acqua Di Gio by Giorgio Armani"}, {"t": "p", "text": "Light, aquatic, with a touch of citrus. A genuine all-purpose fragrance, especially in warmer months. Hard to go wrong here."}, {"t": "link", "label": "Shop Acqua Di Gio at Nordstrom →", "href": "https://www.nordstrom.com/s/armani-beauty-acqua-di-gi-eau-de-toilette/7989866"}, {"t": "h", "text": "2. Burberry Hero"}, {"t": "p", "text": "⭐️ my favorite ⭐️ Understated and woodsy with a hint of bergamot. Leans into a masculine frame without begging for attention. This one wears quietly and confidently."}, {"t": "link", "label": "Shop Burberry Hero at Nordstrom →", "href": "https://www.nordstrom.com/s/burberry-hero-eau-de-toilette/6478130"}, {"t": "h", "text": "3. Gucci Guilty"}, {"t": "p", "text": "Lemon, pink pepper, cedar, lavender, mandarin, and crushed green leaves. A lot going on in the best way — makes it a great everyday statement wear without being overpowering."}, {"t": "link", "label": "Shop Gucci Guilty at Nordstrom →", "href": "https://www.nordstrom.com/s/gucci-guilty-pour-homme-eau-de-toilette/3176122"}, {"t": "p", "text": "Start with one. You’ll understand why it matters the first time someone notices."}], "slug": "dezign-ur-ritual", "links": [], "media": "", "seo_title": "Men’s Fragrance 101 | 20 Blok"}, {"id": "issue-5/chain-reaction", "name": "CHAIN REACTION", "emoji": "🔗", "feature": true, "title": "Crypto State of the Union", "dek": "Trust, debasement, and holding.", "img": "", "tags": ["Crypto", "Bitcoin", "Ethereum"], "people": ["Yonatan Sompolinsky", "Tom Lee"], "body": [{"t": "p", "text": "Since Issue 1, this newsletter has been quietly building a crypto foundation — brick by brick.", "links": [{"text": "Issue 1", "href": "https://lennylesser.beehiiv.com/p/about-last-week-issue-1-08fd#onchain-dispatch-what-is-a-cypherpu"}]}, {"t": "p", "text": "We opened with the original cypherpunk principles: why crypto was born, what it was actually for, and why the people behind it weren’t just tech nerds but ideological dissenters from a financial system they didn’t trust."}, {"t": "p", "text": "Then came Yonatan Sompolinsky — the math guy behind Kaspa, whose earlier work on GHOST protocol was cited in Ethereum’s own whitepaper, and who most people still haven’t heard of. We broke down what Kaspa actually is — first in playground metaphors, then in plain terms. Speed without sacrificing the decentralization and security that make the whole thing mean something.", "links": [{"text": "Yonatan Sompolinsky", "href": "https://golden.com/wiki/Yonatan_Sompolinsky-XKEG5YA"}, {"text": "Kaspa", "href": "https://kaspa.org/features/"}, {"text": "playground metaphors", "href": "https://lennylesser.beehiiv.com/p/issue-3-find-your-edge#crypto-dispatch"}, {"text": "plain terms", "href": "https://lennylesser.beehiiv.com/p/issue-4-cold-water#crypto-dispatch"}]}, {"t": "p", "text": "That’s the foundation. Now the harder conversation."}, {"t": "h", "text": "The State of Play"}, {"t": "p", "text": "This isn’t a down year. This isn’t the dog days. For anyone who joined the crypto system in the last four or five years, this has been an absolute financial dumpster fire. And the strange part is — crypto is everywhere in the headlines."}, {"t": "p", "text": "Stablecoins are crypto. Tom Lee’s BitMine just invested $9 billion into Ethereum and other assets, planting a flag that looks a lot like a long-term conviction bet. Bitcoin and Ethereum now have Wall Street ETFs. The infrastructure is being built.", "links": [{"text": "just invested", "href": "https://finance.yahoo.com/news/ethereum-rises-2-000-tom-135631681.html"}]}, {"t": "p", "text": "And yet — most people still don’t really understand what any of it is."}, {"t": "p", "text": "Is it a new financial system? A network of digital communities organized around shared protocols? Is it outside the traditional financial system or now inside it? Are crypto projects just elaborate scams? Is there genuine innovation? Real utility? Are these things commodities, currencies, or something closer to stocks?"}, {"t": "p", "text": "If you answered yes to all of that — you’re actually not wrong."}, {"t": "p", "text": "Here’s the honest read: crypto is currently in its believer stage. Either you believe in it or you don’t. There’s a real possibility it all fails. But there’s also the feeling that its roots are already too deep in the culture and the capital markets to fully disappear."}, {"t": "h", "text": "The Bid Problem"}, {"t": "p", "text": "The core financial problem right now is that most crypto projects can’t hold a bid. That means there isn’t enough sustained buying activity to keep prices stable, let alone growing. They keep falling. The main culprit is trust — or the lack of it. The risk feels too high, the timeline too uncertain, and too many people have been burned to feel comfortable leaving money in."}, {"t": "p", "text": "But zoom out, and the picture gets more interesting."}, {"t": "p", "text": "Crypto has always been, at its heart, a retail phenomenon. It moves on emotion. And right now, retail — the everyday investor, Main Street — is wrecked. Everything we bought five or six years ago costs roughly double. Wages didn’t double. Savings didn’t double. The gap between what things cost and what people actually have is widening in ways that are hard to look at directly."}, {"t": "p", "text": "And here’s where crypto was supposed to be the answer — and why so many people flocked to it in the first place."}, {"t": "h", "text": "Dollar Debasement"}, {"t": "p", "text": "When a government prints money at scale, the value of every dollar (or any other nationalized unit of currency) already in circulation quietly shrinks. It’s inflation’s quieter cousin — less visible, more systemic. Crypto, Bitcoin especially, was built as a direct response to that: a fixed supply, no central authority, no printing press. The pitch was sound money for a world that had stopped trusting fiat."}, {"t": "p", "text": "The irony is brutal: the very conditions that justified crypto’s existence are now the same conditions making it hard for regular people to stay in it. When your rent is up 40% and your grocery bill is up 30%, you don’t leave money sitting in volatile assets hoping for a ten-year payoff. You pull it out."}, {"t": "pull", "text": "The pain of being early and called stupid. That’s the price of entry for asymmetric upside."}, {"t": "h", "text": "Where We Stand"}, {"t": "p", "text": "The problems crypto is trying to solve are real. But trust — in the projects, in the people running them, in the timeline — is still being sorted out."}, {"t": "p", "text": "Crypto’s allure, beyond the technology, was being early to a new capitalistic frontier. It’s not quite like anything we’ve seen before — part investment, part digital community, part ideology."}, {"t": "p", "text": "If we knew where this was heading, the payout would be low. That’s what government bonds are for — parking money in an instrument that pays 3–5% with near certainty."}, {"t": "p", "text": "Crypto offers no such certainty: the volatility, the not knowing, the pain of being early and called stupid. That’s the price of entry for asymmetric upside."}, {"t": "p", "text": "Whether that price buys protection from dollar debasement, inflation, and a broken job market remains the question. We’re invested in the answer."}], "slug": "chain-reaction", "links": [], "media": "", "seo_title": "Crypto State of the Union — Yonatan Sompolinsky | 20 Blok"}, {"id": "issue-5/lolz", "name": "LOLZ", "emoji": "🤣", "feature": false, "title": "Portlandia: Underrated or Just Forgotten?", "dek": "A sketch show that never got its full flowers.", "img": "i5_yt_aW5Xz64F3t4", "tags": ["Comedy"], "people": ["Portlandia", "Fred Armisen", "Carrie Brownstein"], "body": [{"t": "p", "text": "Fred Armisen and Carrie Brownstein created something genuinely special with Portlandia — a sketch show that ran from 2011 to 2018 and somehow never got its full flowers. This clip is a good place to start."}, {"t": "img", "src": "i5_yt_aW5Xz64F3t4", "cap": "Portlandia: Guac Tacs. Watch on YouTube.", "alt": "Portlandia sketch: Guac Tacs", "href": "https://www.youtube.com/watch?v=aW5Xz64F3t4", "badge": "WATCH ON YOUTUBE"}, {"t": "img", "src": "i5_portlandia", "cap": "", "alt": "Portlandia season one cover with Fred Armisen and Carrie Brownstein.", "small": true}, {"t": "link", "label": "Portlandia on Wikipedia →", "href": "https://en.wikipedia.org/wiki/Portlandia"}], "slug": "lolz", "links": [], "media": "", "seo_title": "Portlandia: Underrated or Just Forgotten? — Fred Armisen | 20 Blok"}, {"id": "issue-5/music-flow", "name": "MUSIC FLOW", "emoji": "🎧", "feature": false, "title": "Omido’s “LSD” and a Stunning Video to Match", "dek": "One continuous dance performance. No cuts.", "img": "", "tags": ["Music"], "people": ["Omido"], "body": [{"t": "p", "text": "If you haven’t seen this one yet, get ready."}, {"t": "p", "text": "Omido is an Austrian producer and DJ who makes slow, organic, guitar-influenced electronic music that doesn’t sound like anything else in the space. He grew up on metal, got lost in drum and bass, then picked the guitar back up and built something entirely his own."}, {"t": "p", "text": "“LSD” is the result. The song itself is a melodramatic electronic love ballad about knowing better and falling anyway."}, {"t": "p", "text": "But the video is what makes it a comprehensive classic:"}, {"t": "p", "text": "One continuous dance performance shot through a remote woodsy house. No cuts, no production tricks — just movement, space, and the song doing its job."}, {"t": "p", "text": "It’s been five years and it doesn’t get old."}, {"t": "img", "src": "", "cap": "Omido: LSD. Watch on YouTube.", "alt": "Omido: LSD", "href": "https://www.youtube.com/watch?v=I3g8dvoHlnI", "badge": "WATCH"}, {"t": "p", "text": "Two other songs with dance videos in a similar vein that stood out to me:"}, {"t": "img", "src": "i5_yt_ESXgJ9-H-2U", "cap": "Watch on YouTube.", "alt": "Dance music video", "href": "https://www.youtube.com/watch?v=ESXgJ9-H-2U", "badge": "WATCH"}, {"t": "img", "src": "i5_yt_nxg4C365LbQ", "cap": "Watch on YouTube.", "alt": "Dance music video", "href": "https://www.youtube.com/watch?v=nxg4C365LbQ", "badge": "WATCH"}], "slug": "music-flow", "links": [], "media": "", "seo_title": "Omido’s “LSD” and a Stunning Video to Match | 20 Blok"}, {"id": "issue-5/off-the-path", "name": "OFF THE PATH", "emoji": "🧭", "feature": false, "title": "What the World Actually Looks Like", "dek": "Drag countries around the globe and see their real size.", "img": "", "tags": ["Culture"], "people": [], "body": [{"t": "p", "text": "True Size is a tool that lets you compare the actual size of countries on a map. You can drag countries around the globe and see how they actually compare to each other. Classic example: Africa is vastly larger than most maps make it appear."}, {"t": "link", "label": "Try it: The True Size of Countries (truesize.net) →", "href": "https://truesize.net/"}], "slug": "off-the-path", "links": [], "media": "", "seo_title": "What the World Actually Looks Like | 20 Blok"}, {"id": "issue-5/wall-of-sommi", "name": "WALL OF SOMMI", "emoji": "🧱", "feature": false, "title": "Demand Versus Utility", "dek": "Sommi on the “retail pleb minds.”", "img": "i5_yt_KNV1raTA840", "tags": ["Crypto"], "people": ["Sommi"], "body": [{"t": "p", "text": "Sommi addresses his view on the “retail pleb minds.”"}, {"t": "img", "src": "i5_yt_KNV1raTA840", "cap": "Sommi: demand versus utility. Watch on YouTube.", "alt": "Sommi talking to camera", "href": "https://www.youtube.com/watch?v=KNV1raTA840", "badge": "WATCH ON YOUTUBE"}, {"t": "link", "label": "🎥 On YouTube: @yourfriendSOMMI →", "href": "https://www.youtube.com/@yourfriendsommi"}], "slug": "wall-of-sommi", "links": [], "media": "", "seo_title": "Demand Versus Utility — Sommi | 20 Blok"}, {"id": "issue-5/sports-talk", "name": "SPORTS TALK", "emoji": "🏀", "feature": false, "title": "Another Day, Another Caitlin Clark Slight", "dek": "Reggie Miller compared her to Payton Pritchard, with her sitting right there.", "img": "i5_yt_K03m2YqCt4U", "tags": ["Sports", "WNBA"], "people": ["Caitlin Clark", "Reggie Miller"], "body": [{"t": "p", "text": "In a comparison drill on national TV, Reggie Miller compared Caitlin Clark to Payton Pritchard — mostly an NBA bench player — while she was sitting right there!"}, {"t": "p", "text": "The hosts on this clip call it what it is, revealing a potential reason. Some things don’t need a deep dive. Just watch."}, {"t": "img", "src": "i5_yt_K03m2YqCt4U", "cap": "Reggie Miller and Caitlin Clark. Watch on YouTube.", "alt": "Hosts discuss Reggie Miller’s comparison of Caitlin Clark", "href": "https://www.youtube.com/watch?v=K03m2YqCt4U", "badge": "WATCH ON YOUTUBE"}], "slug": "sports-talk", "links": [], "media": "", "seo_title": "Another Day, Another Caitlin Clark Slight — Reggie Miller | 20 Blok"}, {"id": "issue-5/now-playing", "name": "NOW PLAYING", "emoji": "🍿", "feature": false, "title": "Snowpiercer’s Unlikely Masterpiece Has a Portishead Heart", "dek": "A TV show based on a film, and surprisingly impressive.", "img": "i5_yt_OlZENkxybUA", "tags": ["Film", "Music"], "people": ["Snowpiercer", "Jennifer Connelly", "Portishead"], "body": [{"t": "p", "text": "Here’s the TL;DR upfront: Snowpiercer is a TV show based on a film, and it’s surprisingly impressive. Jennifer Connelly carries the show with her talent and understated star power. There are riveting moments throughout — including several live musical performances built directly into the plot.", "links": [{"text": "Jennifer Connelly", "href": "https://www.imdb.com/name/nm0000124/"}]}, {"t": "p", "text": "One of them is a cover of Portishead’s “Glory Box.” 🗺️ Treasure Hunt: the answer is on the Back Page."}, {"t": "link", "label": "🗺️ Jump to the Treasure Hunt answer →", "href": "/issue-5/notes"}, {"t": "p", "text": "Portishead is a late ’90s trip-hop group from Bristol — textured, down-tempo, cinematic, and built around the voice of Beth Gibbons, who sounds like she’s singing from somewhere most people aren’t allowed to go.", "links": [{"text": "Portishead", "href": "https://en.wikipedia.org/wiki/Portishead_(band)"}, {"text": "Beth Gibbons", "href": "https://en.wikipedia.org/wiki/Beth_Gibbons"}]}, {"t": "p", "text": "Funny story: I used to play their albums on repeat way back when, and most people either didn’t know who they were or, worse, made fun of me for listening — calling me weird and saying it was “too dark.” And now? It’s completely normal to love this band."}, {"t": "p", "text": "The ’90s are having a full glow-up moment in culture right now — things that were considered niche or strange are getting the recognition they deserved all along, just twenty-plus years late. Portishead is one of those."}, {"t": "p", "text": "The show itself works surprisingly well given how unlikely the premise sounds — a world where a climate intervention goes catastrophically wrong and freezes the planet. The last survivors live on a massive train that never stops moving. A class-based society forms, followed by a fascinating portrayal of struggle, politics, and violence. It’s genuinely well-executed, especially considering how easily such an ambitious concept could have failed. Though fair warning: it is quite violent."}, {"t": "p", "text": "The scene in this clip features the Glory Box cover performed by Miss Audrey (played by Lena Hall), who runs the train’s nightclub. She sings it to the show’s main antagonist, Joseph Wilford (played by Sean Bean) — and she, not entirely by choice, was once something like his girlfriend.", "links": [{"text": "Lena Hall", "href": "https://www.imdb.com/name/nm2969015/"}, {"text": "Sean Bean", "href": "https://www.imdb.com/name/nm0000293/"}]}, {"t": "p", "text": "The song really hits different when you understand what’s underneath it (the plot dynamics and the Portishead homage)."}, {"t": "img", "src": "i5_yt_OlZENkxybUA", "cap": "Snowpiercer: Miss Audrey sings Glory Box. Watch on YouTube.", "alt": "Snowpiercer: Miss Audrey performs Glory Box", "href": "https://www.youtube.com/watch?v=OlZENkxybUA", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "Check it out. And next issue, we go deeper on Portishead. I promise 😉", "links": [{"text": "next issue, we go deeper on Portishead", "href": "/issue-6/music-flow"}]}, {"t": "p", "text": "You can watch the first episode here:"}, {"t": "img", "src": "i5_yt_42dvJoRz5TE", "cap": "Snowpiercer, full first episode. Watch on YouTube.", "alt": "Snowpiercer full episode", "href": "https://www.youtube.com/watch?v=42dvJoRz5TE", "badge": "WATCH ON YOUTUBE"}, {"t": "link", "label": "🎬 IMDb: Snowpiercer →", "href": "https://www.imdb.com/title/tt6156584/"}], "slug": "now-playing", "links": [], "media": "", "seo_title": "Snowpiercer’s Unlikely Masterpiece Has a Portishead Heart — Jennifer Connelly | 20 Blok"}]}, "6": {"n": 6, "title": "Do You Have What It Takes to Be Early?", "date": "Apr 24, 2026", "month": "April 2026", "pub": "2026-04-24", "cover": "i6_cover", "cover_alt": "Issue 6 cover: a man in a hat and suit walks out of the dark toward a bright city skyline. Do you have what it takes to be early?", "coverlines": ["issue-6/industry-freeks", "issue-6/word-meme", "issue-6/lolz", "issue-6/underground"], "covertext": {"issue-6/industry-freeks": "Joshua Fluke Calls Out Corporate BS", "issue-6/word-meme": "A Moggy Mog World", "issue-6/lolz": "The IT Crowd’s Internet Black Box", "issue-6/underground": "Scipher Punx: Music for the Collapse"}, "notes": {"signoff": "Thanks for reading Issue 6. If you got something out of it, share it with someone who would too.", "editor_notes": "“From the Editor” moved above the table of contents. It reads more like an introduction.", "treasure": {"text": "This original mog meme art is remixed with the 9mm Shigure Ui meme. Viewer discretion.", "gif": "i6_treasure", "link": {"label": "9mm Shigure Ui on Know Your Meme →", "href": "https://knowyourmeme.com/memes/9mm-shigure-ui"}, "back": {"label": "← Back to WORD MEME", "href": "/issue-6/word-meme"}}, "alpha": "“To be early is to have courage.”", "link_text": "the sign-off, editor notes and the treasure hunt answer →"}, "bloks": [{"id": "issue-6/straight-up", "name": "STRAIGHT UP", "emoji": "🎙️", "feature": false, "editor": true, "title": "Do You Have What It Takes to Be Early?", "dek": "When the crowd moves, step out.", "img": "i6_cover", "tags": ["Culture", "Mindset"], "people": [], "body": [{"t": "p", "text": "Being early means having the courage to stand on a position, a truth, or a value—long before the room catches on."}, {"t": "p", "text": "Our primal instincts tell us to follow the pack to survive."}, {"t": "p", "text": "But you can flip that instinct into a counter-signal: when the crowd moves, step out."}, {"t": "img", "src": "i6_editor", "cap": "If you’re early, you might walk it alone.", "alt": "A lone figure walks through blue fog past the ruins of a collapsed city."}, {"t": "p", "text": "If you wait, you’ll always be dragged along by the warmth of the crowd’s sentiment."}, {"t": "p", "text": "If you recognize the moment, you give yourself a chance to lead and think for yourself—seeing where your true allies really are."}, {"t": "pull", "text": "Do you have what it takes to be early?"}], "slug": "straight-up", "links": [], "media": "", "seo_title": "Do You Have What It Takes to Be Early? | 20 Blok"}, {"id": "issue-6/must-see", "name": "MUST-SEE", "emoji": "👁️", "feature": false, "title": "‘Social’ Impact, Optimized", "dek": "Freya India on online social signaling and the political shift among young women.", "img": "i6_yt_yAeP-OMXOo0", "tags": ["Culture", "Internet Culture", "Media"], "people": ["Freya India", "Winston Marshall"], "body": [{"t": "p", "text": "On The Winston Marshall Show, Freya India unpacks the pressures of online social signaling and the political shifts among young women."}, {"t": "img", "src": "i6_yt_yAeP-OMXOo0", "cap": "Freya India on The Winston Marshall Show. Watch on YouTube.", "alt": "Freya India on The Winston Marshall Show", "href": "https://www.youtube.com/watch?v=yAeP-OMXOo0", "badge": "WATCH ON YOUTUBE"}, {"t": "link", "label": "📖 Her new book: Girls® →", "href": "https://swiftpress.com/book/girls/"}, {"t": "link", "label": "📺 On YT: @WinstonMarshallClips →", "href": "https://www.youtube.com/@WinstonMarshallClips"}], "slug": "must-see", "links": [], "media": "", "seo_title": "‘Social’ Impact, Optimized — Freya India | 20 Blok"}, {"id": "issue-6/industry-freeks", "name": "INDUSTRY FREEKS", "emoji": "🧪", "feature": false, "title": "Dystopia Much?", "dek": "Joshua Fluke sticks it to the corporate posturing machine.", "img": "i6_yt_SES2dL7ardM", "tags": ["Media", "Mindset", "AI"], "people": ["Joshua Fluke"], "body": [{"t": "p", "text": "Banned by LinkedIn for calling out its politically correct culture, Joshua Fluke has spent the last four years doing two things at once:"}, {"t": "ul", "items": ["Helping you put your best foot forward on paper", "Exposing employers’ ridiculous demands in today’s job market"]}, {"t": "p", "text": "He sticks it to the corporate posturing machine—regularly and unapologetically."}, {"t": "img", "src": "i6_yt_SES2dL7ardM", "cap": "Joshua Fluke: Your next paycheck? AI credits! Watch on YouTube.", "alt": "Joshua Fluke: Your next paycheck? AI credits!", "href": "https://www.youtube.com/watch?v=SES2dL7ardM", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "Give this guy a medal or something🥇"}, {"t": "link", "label": "🎥 On YouTube: @JoshuaFluke1 →", "href": "https://www.youtube.com/@JoshuaFluke1"}, {"t": "link", "label": "💊 Bonus: Joshua on the overemployment trend →", "href": "https://www.youtube.com/watch?v=IPfkGP7yOEY"}], "slug": "industry-freeks", "links": [], "media": "", "seo_title": "Dystopia Much? — Joshua Fluke | 20 Blok"}, {"id": "issue-6/newsfeed", "name": "NEWSFEED", "emoji": "📰", "feature": false, "title": "Germany’s Travel Rule That Wasn’t (Almost Was)", "dek": "Drafted, passed, barely reported, then walked back.", "img": "i6_yt_3-0AnbYaG40", "tags": ["News"], "people": [], "body": [{"t": "p", "text": "Germany quietly enacted a Jan 1 rule requiring military-age men to request permission to leave the country—then quietly walked it back after backlash."}, {"t": "p", "text": "The swing-and-a-miss is noteworthy enough; but the fact that it was drafted, passed, and barely reported is just as much of a concern."}, {"t": "img", "src": "i6_yt_3-0AnbYaG40", "cap": "Germany’s travel rule for military-age men. Watch on YouTube.", "alt": "A German flag flies under a grey sky", "href": "https://www.youtube.com/watch?v=3-0AnbYaG40", "badge": "WATCH ON YOUTUBE"}, {"t": "link", "label": "📰 Article reference: DW →", "href": "https://www.dw.com/en/german-bundeswehr-says-military-aged-men-can-travel-freely/a-76738187"}], "slug": "newsfeed", "links": [], "media": "", "seo_title": "Germany’s Travel Rule That Wasn’t (Almost Was) | 20 Blok"}, {"id": "issue-6/word-meme", "name": "WORD MEME", "emoji": "🗿", "feature": false, "title": "To Mog or Get Mogged in a Moggy Mog World", "dek": "How a forum acronym became Gen Z and Gen Alpha’s favorite brag.", "img": "i6_mog_billboard", "tags": ["Memes", "Internet Culture", "Culture", "Crypto"], "people": [], "body": [{"t": "q", "text": "“Mog” (or “mogging”) is a popular Gen Z/Alpha slang term meaning to outshine, outperform, or appear superior to someone else, particularly in attractiveness, fashion, or physical appearance. Originating from the acronym AMOG (“Alpha Male of the Group”), it is often used on social media to describe dominating others or being “shown up” in photos."}, {"t": "cite", "text": "—the internet"}, {"t": "p", "text": "Mog is genuinely one of my favorite terms. At first, it’s an odd expression. It feels like wet laundry out of the mouth."}, {"t": "p", "text": "But with time, and taking notice of its cultural rise, the embrace of the word becomes real."}, {"t": "img", "src": "i6_mog_billboard", "cap": "", "alt": "A Times Square billboard reads “Mog or get Mogged” as people on the street look up."}, {"t": "p", "text": "Somewhere around the early 2000s, before the word knew it existed, the term “AMOG” (Alpha Male of the Group) sprouted up as a way to call out which guy in a group was the leader."}, {"t": "p", "text": "Certain words and expressions have a way of growing beneath the surface, through situational use, and becoming repurposed."}, {"t": "p", "text": "And that’s exactly what happened with mog by the early 2020s, as it ascended through the cultural ranks, picked up mostly by Gen Z and Gen Alpha as everyday slang."}, {"t": "img", "src": "i6_mog_shirt", "cap": "", "alt": "A cartoon girl in round sunglasses wears a T-shirt that reads “it’s a mog or get mogged world.”", "narrow": true}, {"t": "p", "text": "If you got mogged, you were shown up, outshined, got beat or outclassed."}, {"t": "p", "text": "If you did the mogging, you shredded the competition or picked up some kind of life-win—in some cases when others doubted."}, {"t": "p", "text": "It’s an emphatic way to brag, describe triumph or admit defeat."}, {"t": "h", "text": "Unexpected Twist: Mog Glasses"}, {"t": "p", "text": "Enter Mog Coin in 2023, a crypto token built around a community of lovers of the term itself — then given a mascot to go with it."}, {"t": "img", "src": "i6_mog_coin", "cap": "The Mog Coin logo", "alt": "The Mog Coin logo: a laughing cat wearing pixelated rainbow glasses.", "narrow": true}, {"t": "p", "text": "The Mog Glasses have become a symbol and meme unto themselves. And the visual memification of mog — the glasses, the term, and the Mog Cat character — has been blazing its own path ever since. It’s an uncontrollable internet meme that spills out of the screen and into real-life conversation."}, {"t": "p", "text": "Which is how we got here, getting mogged by mog itself."}, {"t": "img", "src": "i6_mog_gif", "cap": "One of many cultural artifacts of mog", "alt": "Animated Mog Cat meme with pixel glasses.", "gif": true}, {"t": "img", "src": "i6_mog_art", "cap": "", "alt": "Anime-style cat girl in rainbow pixel glasses with the words “it’s a mog or get mogged world.”", "narrow": true}, {"t": "link", "label": "🗺️ Do you know which meme this original art remixes? Answer on the Back Page →", "href": "/issue-6/notes"}, {"t": "pull", "text": "Memes create new language."}], "slug": "word-meme", "links": [], "media": "", "seo_title": "To Mog or Get Mogged in a Moggy Mog World | 20 Blok"}, {"id": "issue-6/toolz", "name": "TOOLZ", "emoji": "🤖", "feature": false, "title": "Who Needs an Endless Subscription? Use Qwen Instead", "dek": "One free tool that does the job of five paid ones.", "img": "i6_qwen_tile", "tags": ["AI", "AI Tools"], "people": ["Qwen"], "body": [{"t": "img", "src": "i6_qwen_wide", "cap": "", "alt": "Qwen logo", "narrow": true}, {"t": "p", "text": "What it does: Chat, generate images, analyze videos, process documents, search the web, and use tools — all without juggling five different paid subscriptions."}, {"t": "p", "text": "People are using it for:"}, {"t": "ul", "items": ["Replacing multiple AI tools with a single free alternative", "Generating visuals without a Midjourney subscription", "Processing documents and extracting insights without manual work"]}, {"t": "p", "text": "The bigger shift: Subscription fatigue is real. Qwen proves you don’t need endless monthly charges to access serious AI capability. The gap between “free” and “premium” is closing—fast."}, {"t": "link", "label": "Try Qwen Chat: chat.qwen.ai →", "href": "https://chat.qwen.ai/"}], "slug": "toolz", "links": [], "media": "", "seo_title": "Who Needs an Endless Subscription? Use Qwen Instead | 20 Blok"}, {"id": "issue-6/behind-the-reel", "name": "BEHIND THE REEL", "emoji": "🎞️", "feature": false, "title": "50 Years Later, Still Mad as Hell", "dek": "One person, the right tools, and Network’s most famous scene remade with AI.", "img": "i6_network_remix", "tags": ["AI", "AI Filmmaking", "Film"], "people": ["Unruly Reels", "Jargga"], "body": [{"t": "p", "text": "The cinema classic Network is one of those movies that hasn’t quite had the moment it truly deserves. Not because it wasn’t great but because its warning rang so true, people tend to avoid it.", "links": [{"text": "Network", "href": "https://www.imdb.com/title/tt0074958/"}]}, {"t": "p", "text": "The movie held a mirror to society, and since that moment it has existed inside the broader popular consciousness, waiting to be unearthed again."}, {"t": "p", "text": "That’s what the AI remake of this iconic “I’m mad as hell” scene captures—raw, urgent, and unnervingly current."}, {"t": "img", "src": "i6_yt_ilVdQpaTPdk", "cap": "The AI remake of Network’s “mad as hell” scene. Watch on YouTube.", "alt": "AI remake of the “mad as hell” scene from Network", "href": "https://www.youtube.com/watch?v=ilVdQpaTPdk", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "No studio. No crew. Just one person, the right tools, and a point to make."}, {"t": "img", "src": "i6_yt__RujOFCHsxo", "cap": "The original scene from the movie classic. Watch on YouTube.", "alt": "The original “mad as hell” scene from Network (1976)", "href": "https://www.youtube.com/watch?v=_RujOFCHsxo", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "Takeaway: Cultural commentary no longer requires permission. One person can now resurrect a 50-year-old scene, remix it for today—all from a laptop."}, {"t": "p", "text": "Tools: Veo 3 / Final Cut / Suno"}, {"t": "link", "label": "If this is the kind of work your brand needs ➡️ UnrulyReels.com →", "href": "https://unrulyreels.com"}, {"t": "pair", "items": [{"src": "i6_network_poster", "alt": "The original Network movie poster"}, {"src": "i6_network_remix", "alt": "The Network poster remixed by Jargga: “I’m as mad as hell and I’m not gonna take this anymore.”"}], "cap": "The original movie poster, and the poster remix by Jargga, an account dedicated to word memes."}, {"t": "link", "label": "Jargga on Instagram: @jarggameme →", "href": "https://www.instagram.com/jarggameme/"}], "slug": "behind-the-reel", "links": [], "media": "", "seo_title": "50 Years Later, Still Mad as Hell — Unruly Reels | 20 Blok"}, {"id": "issue-6/find-your-edge", "name": "FIND YOUR EDGE", "emoji": "🗡️", "feature": false, "title": "Dan Koe: Lead Yourself", "dek": "Stop waiting on outside instructions to decide your next move.", "img": "i6_yt_ZM6JkNnOPbg", "tags": ["Mindset"], "people": ["Dan Koe"], "body": [{"t": "p", "text": "I’m such a reluctant Dan Koe fan — and that’s exactly what fascinates me about him."}, {"t": "p", "text": "In this clip, he argues that breaking free from the “old paradigm” means not waiting on outsider instructions to dictate your next move."}, {"t": "img", "src": "i6_yt_ZM6JkNnOPbg", "cap": "Dan Koe: lead yourself. Watch on YouTube.", "alt": "Dan Koe in a black hoodie", "href": "https://www.youtube.com/shorts/ZM6JkNnOPbg", "badge": "WATCH ON YOUTUBE"}, {"t": "link", "label": "More Dan Koe on Substack →", "href": "https://letters.thedankoe.com/"}], "slug": "find-your-edge", "links": [], "media": "", "seo_title": "Dan Koe: Lead Yourself | 20 Blok"}, {"id": "issue-6/underground", "name": "UNDERGROUND", "emoji": "🚇", "feature": true, "title": "Scipher Punx’ Dystopique — the Just-in-Case Album", "dek": "The year is 2113. An insurance policy against a reality that feels increasingly near.", "img": "i6_sp_zero", "tags": ["Music", "Hip-Hop"], "people": ["Scipher Punx"], "body": [{"t": "p", "text": "The year is 2113. The incremental control of society has taken full form."}, {"t": "p", "text": "We live in ghettoized cities, saturated with cameras, programmable money units, and a world where every aspect of life has been restricted by way of calculations and monetization."}, {"t": "p", "text": "Scipher Punx is an insurance policy against a reality that feels increasingly near."}, {"t": "p", "text": "The Dystopique album channels everyday discontent into instrumental and lyrical rebellion."}, {"t": "p", "text": "The album’s tenor clamors like sound waves that ricochet off a city’s concrete corporate buildings—the ones with the reflective windows you can’t see through. It reeks of CCTVs, self-preservation, and a fractured society."}, {"t": "p", "text": "It suggests that our drive to self-automate the world led straight to our own entrapment—placing us squarely in the middle of it."}, {"t": "p", "text": "As a listener, prepare for a mashup of drum & bass, hip-hop, house, trap, and glitch, driven by wobbly bass and subterranean rumbles."}, {"t": "h", "text": "Quick Album Run-Through"}, {"t": "p", "text": "It opens with “Cyphergrid Collapse,” where you might as well be in a high-speed chase from authorities on a party bus. The next two tracks, “Protocol Breach” and “Terminal Velocity,” extend that frantic energy in their own ways.", "links": [{"text": "Cyphergrid Collapse", "href": "https://suno.com/song/8564d8ca-4d5a-405c-8b9f-ba83de7cffbb"}]}, {"t": "img", "src": "i6_sp_blackout", "cap": "Inspired by “Blackout”", "alt": "An electrical tower against a dark, stormy sky, edged in neon."}, {"t": "p", "text": "“Blackout” delivers the first (short) lyrical display, signaling readiness for a grid collapse. The only question: was it triggered by the elites, or the population themselves? Either way, the message is clear—if the power goes out, the sub-citizen plebs are prepared.", "links": [{"text": "Blackout", "href": "https://suno.com/song/f058c36d-5d17-445d-ad65-60610ba89c39"}]}, {"t": "img", "src": "i6_sp_blackout", "cap": "The “Blackout” bonus visual. Watch on Instagram.", "alt": "Scipher Punx “Blackout” bonus visual on Instagram", "href": "https://www.instagram.com/p/DUd8lc2Ejsi/", "badge": "WATCH ON INSTAGRAM"}, {"t": "p", "text": "“Neon Wasteland” is an ode to a future-facing rap love ballad. The hook:", "links": [{"text": "Neon Wasteland", "href": "https://suno.com/song/d1eafa2c-f3d7-4919-b7c7-0dd310446666"}]}, {"t": "q", "text": "“Neon wasteland, neon wasteland\nWe’re the only real thing in a fake land\nNeon wasteland, neon wasteland\nEncrypted love, they can’t understand”"}, {"t": "p", "text": "It’s followed by “Encrypted Memories,” an early-century-style electronic ballad about hiding your true self in an encrypted digital space. She sings:", "links": [{"text": "Encrypted Memories", "href": "https://suno.com/song/b9afd794-2513-4b99-90e7-dc8d175250b0"}]}, {"t": "q", "text": "“The underground is where we trade\nThe only thoughts that haven’t frayed\nPure experience, unrefined\nThe last rebellion of the mind”"}, {"t": "p", "text": "From there, acting like an intermission, the album shifts into the cinematic slowdown of the spoken-word “Ghost Protocol.” At track nine comes the abrasive, industrial-rap “He’s—comp—mised,” shadowing a man hunted for “breathing unmonitored air” in a city that’s a “circuit board prison.” Listen closely to see what happens.", "links": [{"text": "He’s—comp—mised", "href": "https://suno.com/song/4edf58b5-3b08-4b6b-a7b9-74af66ff6f3b"}]}, {"t": "img", "src": "i6_sp_zero", "cap": "", "alt": "A hooded man runs down a graffiti alley through red laser beams under a sign that reads COMPROMISED."}, {"t": "p", "text": "The penultimate track, “Zero Day,” is a rare feel-good moment: a secret speakeasy on the 13th floor of an unmarked, abandoned corporate tower with thin, slit windows. It gives the people a moment to reflect on what life was before it grew so messy and untenable. Sung like a chilled-out Johnny Cash over downtempo drums, it’s a chance to remember.", "links": [{"text": "Zero Day", "href": "https://suno.com/song/5b637229-0916-49e7-9340-6cd377767a63"}]}, {"t": "p", "text": "The album closes with “ShadowNet (So You Wanted This Future),” forcing us to look in the mirror. It suggests we got exactly what we asked for:", "links": [{"text": "ShadowNet (So You Wanted This Future)", "href": "https://suno.com/song/c52c903c-ebaf-4758-8e35-2cf5fa07bc40"}]}, {"t": "q", "text": "“You wanted convenience\nTotal access, seamless experience\nNow the algorithms know\nEvery move before you do”"}, {"t": "h", "text": "If This Ever Happens"}, {"t": "p", "text": "So just in case we find ourselves in a world where governments overreach, the population at large is reduced to wage slaves, our entire society is controlled by algorithms and automation, we’ve been stripped of our fundamental humanity, and forced by calculated submission to surrender our time and energy on society’s terms rather than retaining any semblance of our own agency—this album is for those moments."}, {"t": "p", "text": "Just in case…if that ever were to happen 😜😉😜😉😜"}, {"t": "p", "text": "Enjoy."}, {"t": "link", "label": "🎧 Full album: Scipher Punx – Dystopique on Suno →", "href": "https://suno.com/playlist/edeff75f-1cfb-406b-bf2a-4de529d1d6a5"}], "slug": "underground", "links": [], "media": "", "seo_title": "Scipher Punx’ Dystopique — the Just-in-Case Album | 20 Blok"}, {"id": "issue-6/dezign-ur-ritual", "name": "DEZIGN UR RITUAL", "emoji": "🫖", "feature": false, "title": "Men’s Fragrance Part 2", "dek": "One step past the basics, without jumping straight into niche territory.", "img": "i6_eros", "tags": ["Fragrance", "Style"], "people": [], "body": [{"t": "img", "src": "i6_seinfeld", "cap": "", "alt": "Jerry Seinfeld, serious, GIF", "gif": true}, {"t": "p", "text": "Last issue was Fragrance 101. This time, we take one step forward. If you want to branch out and keep things interesting — without jumping straight into full niche territory — start here."}, {"t": "h", "text": "1. Versace Eros Flame"}, {"t": "p", "text": "Warm, spicy, and brightened by the citrus punch of lemon and tangerine. It plays with the tension between power and passion."}, {"t": "img", "src": "i6_eros", "cap": "", "alt": "A bottle of Versace Eros Flame eau de parfum", "small": true}, {"t": "link", "label": "Shop Versace Eros Flame at Nordstrom →", "href": "https://www.nordstrom.com/s/versace-eros-flame-eau-de-parfum/5228885"}, {"t": "h", "text": "2. Dolce & Gabbana The One"}, {"t": "p", "text": "An unmistakable impression as a charismatic fragrance with a blend of basil, lavender and sandalwood. The entire “The One” line is good, providing different degrees of richness, character and depth."}, {"t": "img", "src": "i6_theone", "cap": "", "alt": "A bottle of Dolce & Gabbana The One", "small": true}, {"t": "link", "label": "Shop Dolce & Gabbana The One at Nordstrom →", "href": "https://www.nordstrom.com/s/dolce-and-gabbana-the-one-eau-de-toilette/7755945"}, {"t": "h", "text": "3. Bleu de Chanel"}, {"t": "p", "text": "You can’t go wrong with Chanel’s quality. A woody, aromatic fragrance with a provocative blend of citrus and woods that liberates the senses."}, {"t": "img", "src": "i6_bleu", "cap": "", "alt": "A bottle of Bleu de Chanel", "small": true}, {"t": "link", "label": "Shop Bleu de Chanel at Nordstrom →", "href": "https://www.nordstrom.com/s/chanel-bleu-de-chanel-eau-de-toilette-spray/3118978"}], "slug": "dezign-ur-ritual", "links": [], "media": "", "seo_title": "Men’s Fragrance Part 2 | 20 Blok"}, {"id": "issue-6/chain-reaction", "name": "CHAIN REACTION", "emoji": "🔗", "feature": false, "title": "What Is Bitcoin?", "dek": "Three minutes, no cypherpunk sermon.", "img": "i6_yt_s4g1XFU8Gto", "tags": ["Crypto", "Bitcoin"], "people": [], "body": [{"t": "p", "text": "We continue to chip away and wrap our heads around crypto. This week, we dial back the edge and start simple: a 3-minute video that explains Bitcoin without the cypherpunk sermon."}, {"t": "img", "src": "i6_yt_s4g1XFU8Gto", "cap": "Bitcoin made simple. Watch on YouTube.", "alt": "Bitcoin made simple", "href": "https://www.youtube.com/watch?v=s4g1XFU8Gto", "badge": "WATCH ON YOUTUBE"}], "slug": "chain-reaction", "links": [], "media": "", "seo_title": "What Is Bitcoin? | 20 Blok"}, {"id": "issue-6/lolz", "name": "LOLZ", "emoji": "🤣", "feature": false, "title": "The Speech That Broke the Internet (Literally)", "dek": "The internet is a small black box with a blinking red light.", "img": "i6_yt_Vywf48Dhyns", "tags": ["Comedy"], "people": ["The IT Crowd"], "body": [{"t": "p", "text": "Jen presents the internet as a small black box with a blinking red light, warning that flash photography could “harm the internet” and send civilization into chaos. What could go wrong?"}, {"t": "img", "src": "i6_yt_Vywf48Dhyns", "cap": "The IT Crowd: the speech. Watch on YouTube.", "alt": "The IT Crowd: Jen gives her speech about the internet", "href": "https://www.youtube.com/watch?v=Vywf48Dhyns", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "The IT Crowd is a cult British sitcom about an IT department in the basement of a corporate tower—critically acclaimed with a devoted following, yet somehow still unseen by too many."}, {"t": "link", "label": "The IT Crowd on IMDb →", "href": "https://www.imdb.com/title/tt0487831/"}, {"t": "link", "label": "More on YouTube →", "href": "https://www.youtube.com/@TheITCrowdChannel"}], "slug": "lolz", "links": [], "media": "", "seo_title": "The Speech That Broke the Internet (Literally) | 20 Blok"}, {"id": "issue-6/music-flow", "name": "MUSIC FLOW", "emoji": "🎧", "feature": true, "title": "What’s a Portishead?", "dek": "Out of the reference and into the source.", "img": "i6_portishead", "tags": ["Music"], "people": ["Portishead", "Beth Gibbons", "Geoff Barrow", "Adrian Utley"], "body": [{"t": "p", "text": "Last issue we went into a story inside a story when we talked about a TV show that featured a cover of a song by the band Portishead.", "links": [{"text": "Last issue", "href": "/issue-5/now-playing"}, {"text": "Portishead", "href": "https://en.wikipedia.org/wiki/Portishead_(band)"}]}, {"t": "p", "text": "This issue, we step out of the reference and into the source."}, {"t": "p", "text": "Portishead’s arrival is the ultimate “you had to be there” moment."}, {"t": "p", "text": "At its core, it’s Beth Gibbons and her eerily beautiful voice singing about love, loss, womanhood, and depression."}, {"t": "p", "text": "The sound was forged alongside Geoff Barrow, the producer and sonic architect layering hip-hop samples and analog textures, and Adrian Utley, whose live guitar work took that textured electronic fabric and humanized it."}, {"t": "p", "text": "Before the trio even locked in, it was local DJ Andy Smith’s crate-digging and shared record collection that supplied the foundational loops and cinematic source material they built on."}, {"t": "img", "src": "i6_portishead", "cap": "Geoff Barrow (background) and Beth Gibbons in the early ’90s. Photograph: Mark McNulty/Retna", "alt": "Black-and-white photo of Geoff Barrow and Beth Gibbons sitting against a metal shutter."}, {"t": "p", "text": "Portishead is like a first love. A band that gave us permission to feel, at a time when being “not okay” wasn’t considered cool. They didn’t just crack the door open to peek at our emotions, they created a timeless portal to walk into and sit in as long as you needed."}, {"t": "p", "text": "We sometimes say artists are “ahead of their time.” But that’s not quite accurate here—because nothing ever actually caught up. And how could it?"}, {"t": "p", "text": "In a modern culture becoming more cookie-cutter by the day—shaped by online social algorithms and dwindling originality—Portishead remains the ultimate singular effort."}, {"t": "p", "text": "Words struggle to pin it down, but I’ll try: downtempo electronic drums, cinematic samples, live instrumentation, and Gibbons’ haunted vocals fused into something starkly original."}, {"t": "p", "text": "At the time, it felt like a preamble for a new musical era to come—except nothing ever did."}, {"t": "p", "text": "You could argue Portishead helped birth downtempo electronic. But that still misses what the band actually was: cinematic, emotional, dark, and fiercely, soulfully authentic."}, {"t": "p", "text": "They dialed into a frequency we’d never heard before—and time has proven we’ll likely never hear anything like it again. That’s why it’s guarded like a protected world treasure."}, {"t": "pull", "text": "So what’s a Portishead? It’s a quiet town eight miles west of Bristol, from which they came. And now it lives in history as something entirely different."}, {"t": "p", "text": "Better than a James Bond soundtrack:"}, {"t": "img", "src": "i6_yt_ymEjfp_o-yQ", "cap": "Portishead. Listen on YouTube.", "alt": "Portishead video", "href": "https://www.youtube.com/watch?v=ymEjfp_o-yQ", "badge": "LISTEN"}, {"t": "p", "text": "On repeat couldn’t kill this song:"}, {"t": "img", "src": "i6_yt_8T0cRt8efsQ", "cap": "Portishead. Listen on YouTube.", "alt": "Portishead video", "href": "https://www.youtube.com/watch?v=8T0cRt8efsQ", "badge": "LISTEN"}, {"t": "p", "text": "They just don’t make them like this anymore:"}, {"t": "img", "src": "i6_yt_-kXC6omhB_w", "cap": "Portishead. Listen on YouTube.", "alt": "Portishead video", "href": "https://www.youtube.com/watch?v=-kXC6omhB_w", "badge": "LISTEN"}, {"t": "p", "text": "Vintage Portishead with the theremin:"}, {"t": "img", "src": "i6_yt_slDNOtOQ8oA", "cap": "Portishead with the theremin. Watch on YouTube.", "alt": "Portishead performing live with a theremin", "href": "https://www.youtube.com/watch?v=slDNOtOQ8oA", "badge": "WATCH"}, {"t": "p", "text": "The original, “Glory Box,” that was covered by the TV show from last issue:"}, {"t": "img", "src": "i6_yt_4qQyUi4zfDs", "cap": "Portishead: Glory Box. Watch on YouTube.", "alt": "Portishead: Glory Box", "href": "https://www.youtube.com/watch?v=4qQyUi4zfDs", "badge": "WATCH"}, {"t": "p", "text": "“feelin’ lonely, feelin’ so unholy,” she says…"}, {"t": "img", "src": "i6_yt_Kv1rYcepTEQ", "cap": "Portishead. Listen on YouTube.", "alt": "Portishead video", "href": "https://www.youtube.com/watch?v=Kv1rYcepTEQ", "badge": "LISTEN"}], "slug": "music-flow", "links": [], "media": "", "seo_title": "What’s a Portishead? — Beth Gibbons | 20 Blok"}, {"id": "issue-6/off-the-path", "name": "OFF THE PATH", "emoji": "🧭", "feature": false, "title": "“Sea Bunny” Eats Poison to Protect Itself", "dek": "", "img": "", "tags": ["Culture"], "people": [], "body": [{"t": "img", "src": "", "cap": "“Sea Bunny” eats poison to protect itself. Watch on YouTube.", "alt": "Sea bunny sea slug", "href": "https://www.youtube.com/shorts/4IA2bUlw1V4", "badge": "WATCH ON YOUTUBE"}], "slug": "off-the-path", "links": [], "media": "", "seo_title": "“Sea Bunny” Eats Poison to Protect Itself | 20 Blok"}, {"id": "issue-6/wall-of-sommi", "name": "WALL OF SOMMI", "emoji": "🧱", "feature": false, "title": "Traders vs. Believers", "dek": "Are prices cheap or expensive?", "img": "i6_yt_lwuwZUcCPzw", "tags": ["Crypto"], "people": ["Sommi"], "body": [{"t": "p", "text": "Sommi challenges us to ask: are prices cheap or expensive?"}, {"t": "img", "src": "i6_yt_lwuwZUcCPzw", "cap": "Sommi: traders vs. believers. Watch on YouTube.", "alt": "Sommi in a red cap, talking to camera", "href": "https://www.youtube.com/watch?v=lwuwZUcCPzw", "badge": "WATCH ON YOUTUBE"}, {"t": "link", "label": "🎥 On YouTube: @yourfriendSOMMI →", "href": "https://www.youtube.com/@yourfriendsommi"}], "slug": "wall-of-sommi", "links": [], "media": "", "seo_title": "Traders vs. Believers — Sommi | 20 Blok"}, {"id": "issue-6/now-playing", "name": "NOW PLAYING", "emoji": "🍿", "feature": false, "title": "Robert Downey Jr.’s Masterclass Inside Sherlock Holmes", "dek": "We watch the spectacle, but miss the mastery.", "img": "i6_rdj", "tags": ["Film"], "people": ["Robert Downey Jr.", "Sherlock Holmes (2009)"], "body": [{"t": "p", "text": "The role of Sherlock Holmes has been played for over a century. Robert Downey Jr. couldn’t just inherit it."}, {"t": "p", "text": "He had to rebuild it through quiet, deliberate choices: how he thinks, how he drinks, how he holds a pause, how he treats every moment like a chess match."}, {"t": "img", "src": "i6_yt_l6TGERgrXmA", "cap": "Sherlock Holmes (2009). Watch on YouTube.", "alt": "Scene from Sherlock Holmes (2009)", "href": "https://www.youtube.com/watch?v=l6TGERgrXmA", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "It’s a masterclass in control. And like the best craft, it’s hiding in plain sight. We watch the spectacle, but miss the mastery."}, {"t": "link", "label": "IMDb: Sherlock Holmes (2009) →", "href": "https://www.imdb.com/title/tt0988045/"}], "slug": "now-playing", "links": [], "media": "", "seo_title": "Robert Downey Jr.’s Masterclass Inside Sherlock Holmes | 20 Blok"}]}};

  seg.addEventListener("pointerup",end); seg.addEventListener("pointercancel",end);
  seg.addEventListener("dragstart",e=>e.preventDefault());
  window.addEventListener("resize",segThumb);
  document.fonts && document.fonts.ready.then(segThumb);
})();
let lastRoute = null;
function render(keepFocus){
  const focused = keepFocus && document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.vote : null;
  const h = curRoute(); setIssueFor(h);
  const blok = BLOKS.find(b=>b.id===h);
  const kids = blok ? articleView(blok) : h==="all-time" ? gridView(true) : h==="past-issues" ? pastView() : (/^issue-\d+$/.test(h) && ARCHIVE[CUR]) ? gridView(false) : (/^issue-\d+\/notes$/.test(h) && ARCHIVE[CUR]) ? archNotesView() : (h==="issue-notes"||h==="bonus") ? notesView() : h==="privacy" ? privacyView() : h==="welcome" ? welcomeView() : h==="contact" ? contactView() : h==="feedback" ? feedbackView() : gridView(false);
  const active = (CUR!==ISSUE) ? "past-issues" : blok ? null : (["all-time","past-issues"].includes(h) ? h : "this-week");
  document.querySelectorAll("[data-route]").forEach(a=> a.dataset.route===active ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  segThumb();
  const hasBand = kids.some(k=>k && k.nodeType===1 && (k.id==="subscribe-band" || k.querySelector("#subscribe-band")));
  const extra = (!hasBand && h!=="welcome") ? [el("div",{class:"article",style:"margin-top:32px"}, subscribeBox())] : [];
  document.getElementById("view").replaceChildren(...kids.filter(k=>k!=null), ...extra);
  if (focused){ const f=document.querySelector('[data-vote="'+focused+'"]'); if (f) f.focus({preventScroll:true}); }
  if (h!==lastRoute){ if (h==="bonus"){ const s=document.getElementById("bonus-section"); if (s) s.scrollIntoView(); } else window.scrollTo(0,0); lastRoute=h; }
  
  document.title = blok ? (blok.seo_title||blok.title+" — 20 Blok") : (TITLES[h] ? TITLES[h]+" — 20 Blok" : "20 Blok — Culture, creativity, and the internet.");
  if (CUR!==ISSUE && !blok) document.title = /\/notes$/.test(h) ? "Issue "+CUR+" Notes: the Back Page | 20 Blok" : "Issue "+CUR+": "+meta().title+" | 20 Blok";
  setTimeout(hydrateEmbeds,0);
  nudgeWatch();
  if (false){}
  else if (commentsUnsub){ commentsUnsub(); commentsUnsub=null; commentsFor=null; }
}
window.addEventListener("hashchange", ()=>{ const h=(location.hash||"").replace(/^#/,""); if (h && isAuthHash(h)) return; if (h) history.replaceState({}, "", "/"+(h==="this-week"?"":h)); render(false); });
render(false);
connect();
