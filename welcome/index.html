<style>
/* Layout: black magazine shell. Home = masthead, cover, cover lines, ranked square grid (4 / 3 / 2 cols). Article = one reading column with drop cap, pull quotes, figures. */
:root{
  --ink:#0B0B0C; --panel:#151517; --panel-2:#1C1C1F; --line:#2C2C31; --paper:#F5F2EA;
  --fg:#FFFFFF; --fg-soft:#D9D9DE; --muted:#A3A3AB; --red:#E0483B; --red-deep:#A8261C;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --serif:"Source Serif 4",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink)}
body{color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:var(--fg)} @media (hover:hover){a:hover{color:var(--red)}}
header.top a,.seg,.tile,.un-card,.issues a,.past-tease{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;text-decoration:none;color:var(--fg)}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(26px,3.2vw,34px);line-height:1;letter-spacing:-.5px}
.logo b{color:var(--red)}
.brand:hover,.brand:active{color:var(--fg)}
.issue-tag{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.7vw,18px);color:var(--fg-soft)}
.howto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:4px 0 22px;padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.howto b{font-family:var(--display);font-weight:900;font-size:clamp(18px,2.2vw,22px)}
.howto ol{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:14px;color:var(--fg-soft)}
.howto li span{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:6px;border-radius:50%;background:var(--red-deep);color:var(--fg);font-weight:800;font-size:12px}
nav.main{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.seg a,.navlink{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;font-weight:700;font-size:12px;letter-spacing:1.5px;color:var(--muted)}
.seg{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.seg a{position:relative;z-index:1;transition:color .28s ease;-webkit-user-drag:none}
.seg a[aria-current="page"]{color:var(--ink)}
.seg-thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .32s cubic-bezier(.3,1.25,.5,1),width .32s cubic-bezier(.3,1.25,.5,1),opacity .2s ease;opacity:0;cursor:grab}
.seg-thumb.on{opacity:1}
.seg.dragging .seg-thumb{transition:none;cursor:grabbing}
@media (max-width:640px){.seg-thumb{top:2px;bottom:2px}}
@media (prefers-reduced-motion:reduce){.seg-thumb{transition:opacity .2s ease}}
.navlink[aria-current="page"]{color:var(--fg)}
.sub{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:1px;color:var(--fg);background:var(--red-deep);box-shadow:0 4px 0 #4a0f0a}
@media (hover:hover){.sub:hover{color:var(--fg);background:#B8301F}}
@media (max-width:640px){
  .bar{gap:6px;padding-block:8px 7px}
  .brand{flex-wrap:nowrap;gap:8px;min-width:0;width:100%}
  .logo{font-size:24px}
  .issue-tag{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  nav.main{width:100%;flex-wrap:nowrap;justify-content:space-between;gap:4px}
  .seg{padding:2px}
  .seg a,.navlink{min-height:32px;padding:0 10px;font-size:10px;letter-spacing:.8px;white-space:nowrap}
  .sub{white-space:nowrap}
  .navlink{padding:0 4px}
  .sub{min-height:32px;padding:0 12px;font-size:10.5px;letter-spacing:.8px;box-shadow:0 3px 0 #4a0f0a}
}
main{padding-block:20px 64px}
/* masthead + cover */
.masthead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-block:6px 14px;border-bottom:3px double var(--line);margin-bottom:20px}
.masthead p{margin:0;font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.masthead .tag{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0;text-transform:none;color:var(--fg-soft)}
.cover{margin:0;border-radius:18px;overflow:hidden;box-shadow:0 10px 0 #000,0 30px 60px rgba(0,0,0,.6);max-width:100%}
.cover img{display:block;width:100%;height:auto}
.cover a{background:#000}
@media (min-width:700px){.cover.tall a{height:min(60vh,560px)}.cover.tall img{height:100%;object-fit:contain}}
.coverlines{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.coverlines{grid-template-columns:repeat(2,minmax(0,1fr))}}
.coverlines a{display:flex;flex-direction:column;gap:6px;height:100%;box-sizing:border-box;padding:14px 16px;border-top:3px solid var(--red);background:var(--panel);border-radius:0 0 12px 12px;text-decoration:none;color:var(--fg)}
.coverlines span{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted)}
.coverlines b{font-family:var(--display);font-weight:800;font-size:clamp(16px,1.8vw,21px);line-height:1.2;text-wrap:balance}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;margin:44px 0 18px}
.section-head h2{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(28px,4vw,44px);line-height:1.05}
.section-head p{margin:0;font-size:14px;color:var(--muted);max-width:52ch}
.hero{display:flex;flex-direction:column;gap:10px;margin-block:8px 28px;max-width:760px}
.eyebrow{margin:0;font-weight:700;font-size:12px;letter-spacing:3px;color:var(--red);text-transform:uppercase}
.hero h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,72px);line-height:1;letter-spacing:-1px}
.hero p{margin:0;font-size:18px;color:var(--fg-soft);max-width:60ch}
/* grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;list-style:none;margin:0;padding:0}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.tile{container-type:inline-size;position:relative;aspect-ratio:1/1;max-width:100%;box-sizing:border-box;padding:clamp(11px,6cqi,20px);display:flex;flex-direction:column;gap:8px;border-radius:16px;border:1px solid var(--line);
  background:var(--panel);overflow:hidden;box-shadow:0 6px 0 #000,0 18px 30px rgba(0,0,0,.45);transition:transform .18s ease,box-shadow .18s ease}
@media (hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:0 9px 0 #000,0 24px 36px rgba(0,0,0,.55)}}
.tile.has-img{background-size:cover;background-position:center 30%}
.tile.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.92) 100%)}
.tile > *{position:relative}
.tile.top{border:2px solid var(--fg)}
.tile.top:not(.has-img){background:var(--fg);color:var(--ink)}
.tile.top:not(.has-img) .dek{color:#3A3A40}
.tile.top:not(.has-img) .label{background:var(--ink);color:var(--fg)}
.tile.top:not(.has-img) .rank{color:var(--red-deep)}
.tile.top:not(.has-img) h2 a{color:var(--ink)}
.tile.top:not(.has-img) .vote{background:rgba(0,0,0,.08)}
.tile.top:not(.has-img) .vote button{color:var(--ink);background:rgba(0,0,0,.08)}
.tile-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rank{font-family:var(--display);font-weight:900;font-size:clamp(22px,12cqi,40px);line-height:1;color:var(--red);font-variant-numeric:tabular-nums lining-nums}
.label{font-weight:800;font-size:clamp(10px,4.6cqi,14px);letter-spacing:.12em;line-height:1.15;text-align:right;color:var(--ink);background:var(--fg);padding:.35em .6em;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.35);max-width:70%}
.feat{align-self:flex-start;font-weight:700;font-size:10px;letter-spacing:2px;padding:4px 9px;border-radius:999px;background:var(--red-deep);color:var(--fg)}
.tile h2{margin:0;margin-top:auto;font-family:var(--display);font-weight:800;font-size:clamp(18px,11cqi,38px);line-height:1.08;text-shadow:0 2px 12px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.tile h2 a{color:var(--fg);text-decoration:none}
.tile{cursor:pointer}
.dek{margin:0;font-size:clamp(12px,4.6cqi,15px);line-height:1.45;color:var(--fg-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.read{font-weight:700;font-size:12px;letter-spacing:1.5px;color:inherit;opacity:.8}
.vote{display:flex;align-items:center;gap:4px;padding:3px;border-radius:14px;background:rgba(0,0,0,.45)}
.vote button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:11px;cursor:pointer;color:var(--fg);background:rgba(255,255,255,.10);transition:transform .1s ease}
.vote button:active{transform:translateY(2px)}
.vote button.up[aria-pressed="true"]{background:var(--red);color:var(--fg)}
.vote button.down[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.score{min-width:30px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:820px){
  .tile{gap:5px;border-radius:14px}
  .dek,.read,.feat{display:none}
  .vote{width:100%;justify-content:space-between;padding:2px}
  .tile{padding:10px;gap:4px}
  .tile-foot{justify-content:flex-end}
  .tile .vote{width:72%;justify-content:space-between;gap:6px;padding:3px 3px 3px 12px;border-radius:12px;background:rgba(0,0,0,.6);flex-direction:row-reverse}
  .tile .vote button{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16)}
  .tile .vote button svg{width:19px;height:19px;stroke-width:3}
  .tile .score{min-width:16px;font-size:15px;text-align:left}
  .tile h2{font-size:clamp(18px,12.8cqi,29px);line-height:1.06;-webkit-line-clamp:4;letter-spacing:-.01em}
  .rank{font-size:clamp(18px,11cqi,28px)}
  .tile > .feat-band{height:16px;font-size:8px;letter-spacing:.3em}
  .tile:has(.feat-band){padding-bottom:20px}
  .tile h2{flex-shrink:0}
  .tile:has(.feat-band) h2{-webkit-line-clamp:3}
  .label{font-size:clamp(8.5px,5cqi,11px);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78%;padding:.35em .5em}
}
/* article */
.article{max-width:740px;margin:0 auto}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:700;font-size:13px;letter-spacing:1px;text-decoration:none;color:var(--muted)}
.art-head{display:flex;flex-direction:column;gap:14px;margin-block:10px 28px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.art-label{font-weight:700;font-size:13px;letter-spacing:2.5px;color:var(--red)}
.art-head h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(32px,5.4vw,56px);line-height:1.04;letter-spacing:-.5px;text-wrap:balance}
.art-dek{margin:0;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.45;color:var(--fg-soft)}
.byline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.byline p{margin:0;font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--muted)}
.byline b{color:var(--fg)}
.art-hero{margin:0 0 28px;border-radius:14px;overflow:hidden}
.art-hero img{display:block;width:100%;height:auto}
.prose{display:flex;flex-direction:column;gap:18px;font-family:var(--serif);font-size:19px;line-height:1.7;color:#ECECEF;max-width:68ch}
.prose p{margin:0}
.prose p.lead::first-letter{float:left;font-family:var(--display);font-weight:900;font-size:4.2em;line-height:.82;padding:6px 10px 0 0;color:var(--red)}
.prose h3{margin:18px 0 0;font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:2.5px;text-transform:uppercase;color:var(--fg)}
.prose blockquote{margin:0;padding:20px 24px;border-radius:12px;background:#26262B;border:1px solid #34343A;font-style:italic;color:var(--fg)}
.prose blockquote .q-cite{display:block;margin-top:12px;font-family:var(--sans);font-style:normal;font-size:14px;font-weight:700;color:var(--muted)}
.prose .cite{margin-top:-8px;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--muted)}
.prose .cap{font-family:var(--sans);font-size:14px;color:var(--muted)}
.prose ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.prose a{color:var(--fg);text-decoration-color:var(--red);text-underline-offset:3px;overflow-wrap:anywhere}
.prose strong{font-family:var(--sans);font-size:.85em;letter-spacing:.5px}
.pull{margin:14px 0;padding:22px 0;border-top:3px solid var(--red);border-bottom:1px solid var(--line);font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(24px,3.4vw,32px);line-height:1.25;color:var(--fg);text-wrap:balance}
.fig{margin:6px 0;display:flex;flex-direction:column;gap:8px}
.fig .frame{display:block;position:relative;border-radius:12px;overflow:hidden;background:var(--panel);max-width:100%}
.fig img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#000}
.fig figcaption{font-family:var(--sans);font-size:13.5px;color:var(--muted)}
.fig .badge{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.75);font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:1.5px;color:var(--fg);text-decoration:none}
.media{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:12px;border:1px dashed var(--line);font-family:var(--sans);color:var(--fg-soft);font-size:15px}
.media strong{font-size:11px;letter-spacing:2px;color:var(--red)}
.sign{font-family:var(--display);font-style:italic;font-weight:700;font-size:24px;color:var(--fg)}
.pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;background:var(--panel);text-decoration:none;color:var(--fg);min-width:0}
.pager a span{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted)}
.pager a b{font-family:var(--display);font-size:16px;font-weight:800;line-height:1.25}
.pager .next{text-align:right}
.notes-link{display:flex;flex-direction:column;gap:4px;margin-top:28px;padding:18px 20px;border-radius:14px;border:1px dashed var(--line);text-decoration:none;color:var(--fg)}
.notes-link span{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--red)}
.notes-link b{font-family:var(--display);font-weight:800;font-size:clamp(17px,2vw,21px)}
.notes .note{display:flex;flex-direction:column;gap:12px;padding-block:6px 18px;border-bottom:1px solid var(--line)}
.notes .note:last-child{border-bottom:0}
.car .track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.car .slide{flex:0 0 min(82%,420px);scroll-snap-align:start;margin:0}
.car .slide img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:10px}
.car .ctrl{display:flex;align-items:center;gap:14px;margin-top:10px;font-family:var(--sans);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.car .rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--red);background:none;color:var(--red);font-size:20px;line-height:1;cursor:pointer}
@media (hover:hover){.car .rb:hover{background:rgba(224,72,59,.15)}}
.car .ctrl .cc{margin-left:auto}
.car .slide{cursor:zoom-in}
.lbx{position:fixed;inset:0;z-index:50;background:#060607;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:#fff}
.lbx-top{display:flex;justify-content:space-between;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums}
.lbx-close{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;font:600 13px var(--sans);padding:7px 16px;cursor:pointer}
.lbx-stage{position:relative;min-height:0;padding:0 64px}
.lbx-strip{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.lbx-strip::-webkit-scrollbar{display:none}
.lbx-slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center;padding:0 8px;box-sizing:border-box}
.lbx-slide img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lbx-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.5);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.lbx-nav.p{left:10px}.lbx-nav.n{right:10px}
.lbx-hint{padding:10px 16px 16px;text-align:center;font-family:var(--sans);font-size:13px;color:#aaa}

<script>
const CURRENT = [{"id": "issue-7/straight-up", "name": "STRAIGHT UP", "emoji": "🎙️", "feature": false, "title": "Retail Mindset", "dek": "Buying headlines like stocks: late to the story, sure of it anyway.", "media": "", "links": [], "body": [{"t": "p", "text": "When we talk about “retail” in financial news, we mean the crowd: the average Jill and Joe putting their money into the markets."}, {"t": "p", "text": "Buuuuuut,,,retail has become the punchline: the investor who arrives late, FOMOs into the hottest trends and gets caught wrong-footed when the timing turns."}, {"t": "p", "text": "Retail is the herd. And it points to something beyond investing: the retail mindset."}, {"t": "img", "src": "su_crowd", "cap": "", "alt": "A crowd walks the same direction over red arrows, every phone lit with charts and alerts.", "video": false}, {"t": "p", "text": "Outside finance, it comes from our blind consumption of digital media feeds: the trending story, the viral opinion, the social cause of the week, each one prompting us to care, react and publicly declare our position."}, {"t": "img", "src": "su_shopper", "cap": "", "alt": "A woman pauses at a store shelf stocked with charts, hearts and alerts, her phone in the shopping cart.", "video": false}, {"t": "p", "text": "It’s the retail investor all over again. Only now we’re buying headlines instead of stocks: late to the story, sure of it anyway, and the last to know when it changes."}, {"t": "pull", "text": "Only now we’re buying headlines instead of stocks."}, {"t": "p", "text": "Being aware of the retail mindset doesn’t mean rejecting every trend. It means noticing where your attention is being directed, by whom, and whether your opinions are actually yours."}, {"t": "p", "text": "You do not always have to go against the crowd.", "tail": "But you should at least know when you’re inside it."}], "img": "cover", "editor": true, "tags": ["Culture", "Internet Culture", "Media", "Mindset"], "people": [], "seo_title": "Retail Mindset | 20 Blok", "slug": "straight-up"}, {"id": "issue-7/must-see", "name": "MUST-SEE", "emoji": "👁️", "feature": false, "title": "Maeve Halligan Swims Upstream at Cambridge", "dek": "Under 12 minutes at the Cambridge Union, and a new, quiet defiance.", "media": "", "links": [], "body": [{"t": "img", "src": "ms_interview", "cap": "Maeve Halligan’s interview with Winston Marshall. Watch on YouTube.", "alt": "Thumbnail of Maeve Halligan’s interview with Winston Marshall", "video": true, "href": "https://www.youtube.com/watch?v=dSTbywrkZCk", "badge": "WATCH ON YOUTUBE"}, {"t": "p", "text": "Maeve Halligan may represent more than she realizes. In under 12 minutes at the Cambridge Union this May, she became the face of what could be an inflection point in the gender war Western society has created."}, {"t": "p", "text": "Halligan, founding president of the Cambridge University Society of Women, spoke for the motion: “This House Believes Modern LGBTQ+ Activism Fails Its Community.”"}, {"t": "p", "text": "Her argument: the movement has drifted from the gay and lesbian rights it was built to defend, and is now failing the very people it was built to protect. That includes lesbians, kids and—this is key—women. She covered sex-based rights, the medicalization of children, institutional power and the social cost of questioning the approved line."}, {"t": "p", "text": "Underneath it all is one simple claim: sex is real. Everything else, including women’s rights, stands on it. The irony? Saying a man is a man and a woman is a woman is now controversial."}, {"t": "pull", "text": "Saying a man is a man and a woman is a woman is now controversial."}, {"t": "p", "text": "The motion lost. But 50 people abstained, a sign of what Halligan called “a new, quiet defiance.”"}, {"t": "p", "text": "The power wasn’t just the argument. It was watching a young woman stand before her own generation and say it without shrinking."}, {"t": "p", "text": "Above is her interview with Winston Marshall. The speech itself is below, on her X account."}, {"t": "img", "src": "ms_speech", "cap": "The speech: Maeve Halligan at the Cambridge Union, May 14, 2026. Watch on X.", "alt": "Maeve Halligan’s post on X with the Cambridge Union speech video. Watch on X.", "video": false, "href": "https://x.com/MaeveHalligan/status/2055228205804421218", "badge": "", "narrow": true, "nobadge": true, "keepThumb": true}, {"t": "img", "src": "shirt", "cap": "The moderator’s response to an audience member’s interjection was so dry it became a meme of its own.", "video": false}, {"t": "clip", "src": "ms_moment", "poster": "ms_moment_poster", "cap": "The moment: “No back and forth without the speaker accepting.” Sound on.", "alt": "Clip from the Cambridge Union debate: “No back and forth without the speaker accepting.”"}, {"t": "img", "src": "button", "cap": "New fandom activated.", "video": false}, {"t": "link", "label": "Halligan on X: @MaeveHalligan →", "href": "https://x.com/MaeveHalligan"}, {"t": "link", "label": "📺 On YT: @WinstonMarshallClips →", "href": "https://www.youtube.com/@WinstonMarshallClips"}, {"t": "link", "label": "💊 Bonus: Pearl Davis debates Meredith Grace on women’s nurture versus nature. Watch it on the Back Page →", "href": "/bonus"}], "img": "shirt", "tags": ["Culture", "Internet Culture", "Media"], "people": ["Maeve Halligan", "Winston Marshall", "Pearl Davis", "Meredith Grace"], "seo_title": "Maeve Halligan Swims Upstream at Cambridge — Winston Marshall | 20 Blok", "slug": "must-see"}, {"id": "issue-7/industry-freeks", "name": "INDUSTRY FREEKS", "emoji": "🧪", "feature": false, "title": "Taavi.TV: The Artist Whisperer", "dek": "Keep it gutter. Finish the thing, even when it isn’t perfect.", "media": "Video: a Taavi.TV clip.", "links": [], "body": [{"t": "img", "src": "if_short", "cap": "Taavi: it doesn’t depend on equipment. Watch on YouTube.", "alt": "Taavi: it doesn’t depend on equipment. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/shorts/OlLU39XXuxA"}, {"t": "p", "text": "Taavi is a spiritual guide, a creative’s best friend and a mentor all in one. Every day on his channel, he takes on doubt, momentum and energy—the things that stand between your creative side and the work you want to make."}, {"t": "p", "text": "For decades, creators have been handed bad advice: follow your passion and be unapologetically you. Do that, and everything works out."}, {"t": "p", "text": "That was brutally reckless."}, {"t": "p", "text": "It helped create a sea of people online making content while still searching for direction and significance. This is where Taavi comes in."}, {"t": "p", "text": "One of his mantras is “keep it gutter.” Keep it fresh, keep it moving, keep the main thing the main thing. It’s not about the equipment, and it’s not about the excuse. It’s about the thing you came to do."}, {"t": "pull", "text": "Keep it gutter."}, {"t": "p", "text": "He speaks directly to the lack of confidence and the lizard brain that somehow chooses failure over winning. He gets into the parts of creative life most advice skips, and steers people toward acting on their ideas and getting the results they set out for. And this is key: finishing, even when it’s not perfect."}, {"t": "img", "src": "if_short2", "cap": "Taavi: first take is always the best take. Watch on YouTube.", "alt": "Taavi: first take is always the best take. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/shorts/FNamLVFrISE"}, {"t": "link", "label": "On IG: @TAAVI.TV →", "href": "https://www.instagram.com/taavi.tv"}], "img": "if_short", "tags": ["Creativity", "Mindset", "Media"], "people": ["Taavi.TV"], "seo_title": "Taavi.TV: The Artist Whisperer | 20 Blok", "slug": "industry-freeks"}, {"id": "issue-7/newsfeed", "name": "NEWSFEED", "emoji": "📰", "feature": true, "title": "Should We Talk About Lindsay Clancy? (Prob Not)", "dek": "A mistrial, an online movement and the digital herd.", "media": "", "links": [], "body": [{"t": "h", "text": "What Happened"}, {"t": "p", "text": "I'm starting to think that when something doesn't align with an ideology we're emotionally attached to, we narcissistically search for a way to excuse it."}, {"t": "p", "text": "In the case of Lindsay Clancy—whose defense never disputed that she killed her three children—that appears to be exactly what happened within a significant online community, much of it made up of women who swiftly rallied around her."}, {"t": "p", "text": "Her defense argued that postpartum psychosis left her without criminal responsibility. In September the trial ended in a mistrial: one juror didn’t agree with the other eleven, who sided with the defense. A verdict for the defense would have found her not criminally responsible. Instead of prison, she would most likely have been committed to a psychiatric hospital. So the outcome, for now, is a mistrial. Prosecutors haven’t said whether they’ll retry her, and her next hearing is Nov. 2."}, {"t": "h", "text": "Being Diplomatic"}, {"t": "p", "text": "A positive result of this case is the increased awareness of postpartum mental and emotional health, which, let's be honest, few people—men for sure, but possibly many women too—really knew much about. Hopefully, in the years and decades ahead, we will develop a much stronger understanding of how serious these conditions can become."}, {"t": "p", "text": "But in all the awareness raised about postpartum depression and psychosis, is it possible we forgot that Lindsay Clancy strangled her three children with exercise bands?"}, {"t": "p", "text": "Holding both at once is the most diplomatic take this case allows."}, {"t": "h", "text": "Cult-Like"}, {"t": "p", "text": "One striking development within this story was how fast a large, visible group—mostly women but not all—seemed to synchronize around defending Clancy. Did it go beyond acknowledging mental illness or trying to understand what happened, and move into rationalization, defending her because she’s a woman and purely ideological, self-preserving excuse-making?"}, {"t": "p", "text": "Modern post-feminist culture has trained many people to see a woman in crisis as a victim before they see her as a moral agent. That instinct can come from compassion. It can also become a serious form of bias."}, {"t": "p", "text": "Once that lens becomes ideological, almost any act can be processed as something that happened to her, rather than something she did."}, {"t": "p", "text": "And maybe it comes down to ideological taste: should society be held accountable, or the person who acted?"}, {"t": "pull", "text": "People do not always arrive at the same conclusion independently. Sometimes they learn how their group expects them to feel."}, {"t": "h", "text": "The Digital Herd"}, {"t": "p", "text": "Most likely, our accelerated technology and media environment amplified the cause and set it ablaze, giving some people an identity and an approved emotional response that played out performatively across media platforms."}, {"t": "p", "text": "In 2026, people signal which side they belong to, especially when a powerful narrative or public image feels threatened. If the narrative shifts toward the idea that women can be evil too—not just men—the people invested in the existing premise begin to feel attacked."}, {"t": "p", "text": "In this case, Clancy's supporters—I guess we'll call them that—believe she did not receive the attention and care she deserved, and that the system and the people around her failed her at every turn. When that belief felt threatened, they got louder."}, {"t": "p", "text": "The effect resembled a kind of public hypnosis."}, {"t": "p", "text": "We saw strange versions of this during the COVID era: people rapidly separated into identity groups, performed group dances in masks and repeated slogans like \"safe and effective,\" handed down by authorities like modern-day memes."}, {"t": "p", "text": "It may take future studies, far enough removed from this period, to honestly examine how digital technology, cause-based signaling and algorithms that reward what we already believe created this kind of mass, cult-like behavior."}, {"t": "p", "text": "People do not always arrive at the same conclusion independently. Sometimes they learn how their group expects them to feel."}, {"t": "h", "text": "What Still Matters"}, {"t": "p", "text": "Everything is becoming ideologically outlined: blue or red, men or women, victim or perpetrator, compassion or accountability. Once the categories are assigned, people defend their side before they judge the act itself."}, {"t": "p", "text": "Postpartum mental conditions deserve serious attention."}, {"t": "p", "text": "So does the fact that Lindsay Clancy strangled her three children."}, {"t": "p", "text": "Acknowledging that does not make someone anti-woman or anti-mental health. It means refusing to let a cause edit the facts to protect itself."}, {"t": "img", "src": "nf_200m", "cap": "Watch on YouTube.", "alt": "Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/watch?v=dGmnBg2rXME"}, {"t": "img", "src": "nf_short", "cap": "Watch on YouTube.", "alt": "Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/shorts/_OC2qzEVSyE"}], "img": "nf_200m", "tags": ["News"], "people": ["Lindsay Clancy"], "seo_title": "Should We Talk About Lindsay Clancy? (Prob Not) | 20 Blok", "slug": "newsfeed"}, {"id": "issue-7/word-meme", "name": "WORD MEME", "emoji": "🗿", "feature": false, "title": "I Turned It Down ↔ I Turnt It Down", "dek": "Big Boogie’s scholarship story becomes meme lore.", "media": "", "links": [], "body": [{"t": "p", "text": "Big Boogie is an American rapper. He has more than a million followers on Instagram and is well established in his own right."}, {"t": "p", "text": "He also happens to be responsible for one of the most recognizable word meme moments in pop culture: “I turned it down” or, exactly as it came out, “I turnt it down.”"}, {"t": "img", "src": "wm_clip", "cap": "Big Boogie: “I turnt it down.” Watch on YouTube.", "alt": "Big Boogie: “I turnt it down.” Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/shorts/bDTXR-uy4SY"}, {"t": "p", "text": "In what first looked like an unabashed troll job on The Bootleg Kev Podcast, Big Boogie was asked whether he went to college. He said he didn’t, because he had “turned it down” to “grind from the rap.”"}, {"t": "p", "text": "When the interviewer asked what, exactly, he had turned down, Big Boogie said he'd received a band scholarship to a college in Jacksonville, with an offer somewhere between $5 million and $15 million."}, {"t": "q", "text": "“I ain’t go to college, but, umm, I turned it down. Yeah, I turned it down, just to do this, just to grind from the rap. Yeah, scholarship and everything. Umm, I think it was, like, in Jacksonville. Yeah, a big band in Jacksonville. It was a big college, though, and they offered me, like, 15—some shit like 10 million or something like that, five million, something like that—on scholarship. Yeah, like, what the fuck, y’all, if you know what I’m saying. But I was just so younger, like, I didn’t know what it was. Tsssss. I turned it down. It was a scholarship, like, I had to go to school for this decade. Yeah, it was somewhat like—it was in the millions, though.”"}, {"t": "cite", "text": "— Big Boogie"}, {"t": "p", "text": "The genius of the moment is the confidence behind the assertion: he turned down the opportunity, not the other way around. Then there's the fact that he can't remember whether he was offered $5 million, $10 million or $15 million; the condition that he'd have to attend school \"for this decade\"; and, of course, the facial expressions and head turns."}, {"t": "p", "text": "It truly is a moment of internet gold."}, {"t": "pair", "items": [{"src": "wm_tee1", "alt": "Black T-shirt with an illustration of Big Boogie and the words I TURNED IT DOWN"}, {"src": "wm_tee2", "alt": "Black T-shirt reading I TURNT IT DOWN over a photo of Big Boogie at the mic"}], "cap": "I turned it down ↔ I turnt it down."}, {"t": "pull", "text": "“I turnt it down.”"}, {"t": "p", "text": "The more I watch this clip—and the minutes before and after it—the more I find myself doing a little self-persuasion: maybe he really did get some kind of offer, or at least something was in motion. Big Boogie is likable, and there's something honest and charismatic about him that makes you want to believe him."}, {"t": "loop", "src": "boogie_mp4", "poster": "boogie_poster", "alt": "Big Boogie grinning at the mic", "narrow": true}, {"t": "p", "text": "Born John Lotts, Big Boogie is a bona fide success story. He lost his father while he was still in the 10th grade and later lost his brother Brandon, yet kept moving forward and built a successful music career, eventually signing with Yo Gotti's CMG."}, {"t": "p", "text": "\"I turnt it down\" works because it captures who he is in real time: gracious, entertaining, creative, adaptable and unbothered by what people might think."}, {"t": "p", "text": "The meme is another trophy in his cabinet—culturally relevant, biographically interesting and a new piece of language for the rest of us to use, carrying the spirit of his hustle with it."}, {"t": "p", "text": "So next time you miss the event, skip the meeting or don’t get the date, and someone asks about it, just say, “I turnt it down,” and leave it at that."}, {"t": "p", "text": "Original Bootleg Kev interview with Big Boogie (long form):"}, {"t": "img", "src": "wm_full", "cap": "The full Bootleg Kev interview. Watch on YouTube.", "alt": "The full Bootleg Kev interview. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/watch?v=_0cdK76ArjU"}], "img": "wm_clip", "tags": ["Memes", "Comedy", "Culture"], "people": [], "seo_title": "I Turned It Down ↔ I Turnt It Down | 20 Blok", "slug": "word-meme"}, {"id": "issue-7/toolz", "name": "TOOLZ", "emoji": "🤖", "feature": false, "title": "Don’t Sleep💤 on Grok", "dek": "The AI built into X, and the catch that comes with it.", "media": "", "links": [{"label": "Take me to Grok", "href": "https://grok.com/"}], "body": [{"t": "img", "src": "tz_grok", "cap": "", "alt": "Grok logo", "video": false, "badge": ""}, {"t": "p", "text": "What it does: Grok is xAI’s answer to ChatGPT, with one major advantage: it’s built directly into X. It searches the web and X in real time and makes images and short videos."}, {"t": "p", "text": "People are using it for:"}, {"t": "ul", "items": ["Searching what’s happening across X in real time", "Calling Grok directly into conversations as a built-in X bot", "Creating images, short videos and image-to-video experiments quickly"]}, {"t": "p", "text": "The bigger shift: You don’t leave X to research a topic or make something. The assistant is already inside the stream where the idea appeared, and the image and video tools are fast and easy to use."}, {"t": "p", "text": "The catch: There’s some free usage, but it pushes you toward SuperGrok, the paid plan at roughly $30 a month. Still, if your work runs on internet culture or fast visual experimenting, don’t sleep on it."}], "img": "tz_grok", "tags": ["AI", "AI Tools"], "people": ["Grok"], "seo_title": "Don’t Sleep💤 on Grok | 20 Blok", "slug": "toolz"}, {"id": "issue-7/behind-the-reel", "name": "BEHIND THE REEL", "emoji": "🎞️", "feature": false, "title": "Gen X-Era Advice Gone Way Wrong", "dek": "An AI-made spot on advice handed out without context.", "media": "", "links": [], "body": [{"t": "img", "src": "btr_spot", "cap": "The spot: Gen X-Era Advice Gone Way Wrong. Watch on YouTube.", "alt": "The spot: Gen X-Era Advice Gone Way Wrong. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/watch?v=Z2bSPmElaco"}, {"t": "p", "text": "The sad part is that \"follow your passion,\" \"just be yourself\" and \"money can't buy happiness\" all contain some truth. The problem is that we forget to deliver those messages in context and accurately."}, {"t": "p", "text": "When we preach advice, we also forget how much of our own ego, needs and biases come with it."}, {"t": "p", "text": "For example, \"just being yourself\" with no regard for social context is not an excuse to avoid responsibility or not have your act together."}, {"t": "p", "text": "Ultimately, advice comes from somewhere outside you—not your body, your footsteps, your voice, your situation or your lineage. We can make a case on all sides, but simplistic advice without context might as well be left unsaid."}, {"t": "p", "text": "This commercial spot is about exactly that."}, {"t": "p", "text": "The Hollywood dreamer follows his passion without a real plan. The interviewee clings so tightly to \"just being himself\" that he makes no effort to bridge the gap between his individuality and where he can actually add value."}, {"t": "pull", "text": "Simplistic advice without context might as well be left unsaid."}, {"t": "p", "text": "Then there's the person running out of money while the bills and stress pile up. At that point, is money really such a bad thing?"}, {"t": "p", "text": "You might be thinking, duh—of course money matters. But when we tell an 8-, 10-, 12- or 14-year-old that money can't buy happiness, we forget how impressionable children are and how literally they can absorb a slogan."}, {"t": "p", "text": "The spot names the problem and calls it out without getting too complicated or dark. It takes familiar advice, puts it under real-world pressure and lets the contradictions expose themselves."}, {"t": "p", "text": "Takeaway: This is what excites me about AI filmmaking. I can take a cultural observation that's been sitting in my head, turn it into characters and scenes, and build it into a commercial-style mini-film—without waiting for permission or a traditional production budget."}, {"t": "p", "text": "Tools: Veo 3 / Final Cut / Suno"}, {"t": "p", "text": "If your brand needs this kind of culturally driven storytelling ➡️ 🔗 UnrulyReels.com"}], "img": "btr_spot", "tags": ["AI", "AI Filmmaking", "Comedy"], "people": ["Unruly Reels"], "seo_title": "Gen X-Era Advice Gone Way Wrong — Unruly Reels | 20 Blok", "slug": "behind-the-reel"}, {"id": "issue-7/find-your-edge", "name": "FIND YOUR EDGE", "emoji": "🗡️", "feature": false, "title": "It’s Not Time, It’s Pace", "dek": "Charlie Rocket on letting it rip, even when you’re tired.", "media": "", "links": [{"label": "More about Charlie as a speaker", "href": "https://charlierocket.com/"}], "body": [{"t": "p", "text": "This clip by Charlie Jabaley, known as Charlie Rocket, is for anyone who feels like they’re trying to use every second of every day but gets tired and can’t fit it all in. We forget to be audacious and just let it rip."}, {"t": "p", "text": "The message for me: don’t hold back. Even if you’re tired, you’ve got to do it."}, {"t": "img", "src": "charlie", "cap": "Charlie Rocket: “How do I 7X my speed?” Watch on Instagram.", "video": true, "href": "https://www.instagram.com/reels/DcaFw5cKSjA/", "badge": "WATCH ON INSTAGRAM", "alt": "Charlie Rocket on how to 7X your speed"}, {"t": "p", "text": "More about Charlie as a speaker https://charlierocket.com/"}], "img": "charlie", "tags": ["Mindset"], "people": ["Charlie Rocket"], "seo_title": "It’s Not Time, It’s Pace — Charlie Rocket | 20 Blok", "slug": "find-your-edge"}, {"id": "issue-7/style-scene", "name": "STYLE SCENE", "emoji": "🧥", "feature": false, "title": "Jean Phil, the Best-Dressed Fighter in Paris", "dek": "A librarian’s suit, a street fighter’s moves, an AI face.", "media": "", "links": [], "body": [{"t": "pair", "items": [{"src": "jp_portrait", "alt": "Jean Phil portrait: blond '70s bob, handlebar mustache, houndstooth jacket"}, {"src": "jp_box", "alt": "Jean Phil shadowboxing on a Paris street"}], "cap": ""}, {"t": "p", "text": "Picture a Parisian street. A man in a baggy houndstooth suit and a knotted tie, with a vogued ’70s bob, a curled handlebar mustache, and a neck a little too long. He doesn’t say a word. Then the music hits, hip-hop and gangster rap, and he squares up and starts shadowboxing at nobody."}, {"t": "p", "text": "In a world of memes, sometimes wild stuff emerges. That’s Jean Philanthrope, Jean Phil to his followers. He isn’t real, he’s AI-made."}, {"t": "p", "text": "In September he caught the internet by storm. Within days the account passed 230,000 followers, and single videos cleared 35 million views."}, {"t": "p", "text": "Commenters called him the “final boss,” gamer slang for the last and toughest enemy in a video game. Others said the bob made him a dead ringer for Lord Farquaad, the pint-sized villain from Shrek."}, {"t": "p", "text": "Why it worked is a style question. He dresses like a librarian and moves like he’s from the street. Put the two in one frame and the juxtaposition is the part that attracts attention. It’s offbeat, and it’s hard to look away."}, {"t": "link", "label": "📸 On Instagram: @jeanphilanthrope.co →", "href": "https://www.instagram.com/jeanphilanthrope.co/"}, {"t": "img", "src": "ss_short", "cap": "Jean Phil, counting cash. Watch on YouTube.", "alt": "Jean Phil, counting cash. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/shorts/-0-BhLLQyYM"}, {"t": "h", "text": "Beyond the Style"}, {"t": "p", "text": "The part left out is Jean Phil may have been a ruthless scheme to extract money from meme coin investors. if you want a critical analysis beyond the style shock and the root of what some call a scam with its crypto ties, watch here:"}, {"t": "img", "src": "ss_analysis", "cap": "The breakdown: phone farms, fake influencers and a pump and dump? Watch on YouTube.", "alt": "The breakdown: phone farms, fake influencers and a pump and dump? Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/watch?v=gIaFCy6-UDM"}], "img": "jp_portrait", "tags": ["Style", "Internet Culture", "AI"], "people": ["Jean Philanthrope"], "seo_title": "Jean Phil, the Best-Dressed Fighter in Paris | 20 Blok", "slug": "style-scene"}, {"id": "issue-7/underground", "name": "UNDERGROUND", "emoji": "🚇", "feature": false, "title": "Harry Mack IYKYK", "dek": "A bystander stops to watch and gets rapped into the verse.", "media": "", "links": [], "body": [{"t": "p", "text": "Harry Mack is a freestyle specialist: he improvises words over hip-hop beats, on the spot. He’s been doing it a long time, and it’s safe to say he’s famous. Still, a lot of people don’t know who he is."}, {"t": "p", "text": "In this two-minute clip, a bystander stops to watch, and Harry raps him right into the verse. The man’s black-and-yellow shirt turns into a Wu-Tang line. Run-DMC and Egyptian pharaohs show up too, and none of it was written down. By the end, he’s thanking a fan for the love. If you know, you know."}, {"t": "img", "src": "ug_clip", "cap": "Harry Mack’s street freestyle. Watch on YouTube.", "alt": "Harry Mack’s street freestyle. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/shorts/QR3P57Eym9I"}], "img": "mack", "tags": ["Music", "Hip-Hop"], "people": ["Harry Mack"], "seo_title": "Harry Mack IYKYK | 20 Blok", "slug": "underground"}, {"id": "issue-7/dezign-ur-ritual", "name": "DEZIGN UR RITUAL", "emoji": "🫖", "feature": false, "title": "Fragrance Part III: Niche Edition", "dek": "Aventus, a drunken rose and a speakeasy oud.", "media": "", "links": [], "body": [{"t": "loop", "src": "seinfeld_mp4", "poster": "seinfeld_poster", "alt": "Jerry Seinfeld sips coffee and nods: seriously."}, {"t": "p", "text": "Fragrance 101 got you started. Part 2 took one step forward. This time, we go niche."}, {"t": "h", "text": "1. Creed Aventus"}, {"t": "p", "text": "Aventus means \"toward the wind,\" loosely translating to forward progress. The scent is an ode to success. A sharp opening of pineapple, pink pepper and bergamot, then jasmine and blackcurrant leaf, with birch and patchouli giving it a dry, woody finish. It pierces the senses and sets the stage for the day."}, {"t": "img", "src": "aventus", "cap": "Creed, Aventus.", "alt": "Creed Aventus bottle", "video": false}, {"t": "link", "label": "Shop Creed Aventus at Nordstrom →", "href": "https://www.nordstrom.com/s/creed-aventus-fragrance/3658281"}, {"t": "h", "text": "2. Rose of No Man’s Land by Byredo Absolu De Parfum"}, {"t": "p", "text": "Rose of No Man's Land is what I call a drunken rose. To me it's a going-out scent that sets the tone for a great evening, though it can be worn anytime, and the Absolu formula lasts. Roses run through the whole thing: saffron, blackcurrant and pink pepper up top, black raspberry and peony in the middle, and papyrus, dark patchouli and warm amber underneath, so it lingers smoky."}, {"t": "img", "src": "byredo", "cap": "Byredo, Rose of No Man’s Land Absolu de Parfum.", "alt": "Byredo Rose of No Man’s Land bottle", "video": false}, {"t": "link", "label": "Shop Byredo Rose of No Man’s Land at Nordstrom →", "href": "https://www.nordstrom.com/s/byredo-rose-of-no-mans-land-absolu-de-parfum/8359398"}, {"t": "h", "text": "3. Haltane by Parfums de Marly"}, {"t": "p", "text": "Sweet, smoky and woody: made for a below-ground speakeasy, dressed up, with an attractive energy. It opens fresh with bergamot and lavender, turns sweet with a praline heart, then deepens into oud. Sophisticated, audacious and powerful."}, {"t": "img", "src": "haltane", "cap": "Parfums de Marly, Haltane.", "alt": "Parfums de Marly Haltane bottle", "video": false}, {"t": "link", "label": "Shop Parfums de Marly Haltane at Nordstrom →", "href": "https://www.nordstrom.com/s/parfums-de-marly-haltane-eau-de-parfum/7423663"}], "img": "seinfeld_poster", "tags": ["Fragrance", "Style"], "people": [], "seo_title": "Fragrance Part III: Niche Edition | 20 Blok", "slug": "dezign-ur-ritual"}, {"id": "issue-7/chain-reaction", "name": "CHAIN REACTION", "emoji": "🔗", "feature": true, "title": "We Need to Talk About Bitcoin (Not What You Think)", "dek": "The Bitcoin crowd lost the plot. It’s just the herd, all over again.", "media": "", "links": [], "body": [{"t": "p", "text": "Somewhere along the way, the Bitcoin crowd lost the plot."}, {"t": "p", "text": "Don’t get me wrong, there was nothing more underground and contrarian than a new form of digital money that builds itself outside the US dollar. It still has a viable future, at the very least as digital gold for a newer generation."}, {"t": "p", "text": "This is more about the followers: the more recent adopters and the new era of media Bitcoin maximalists (maxis, the Bitcoin-only crowd)."}, {"t": "h", "text": "WHERE IT STARTED"}, {"t": "p", "text": "Back in Issue 1 we talked about the cypherpunks: DIY rebels who built in code instead of asking permission. Bitcoin was their masterpiece. Sound money with a fixed supply, no central bank, and no way to print more and inflate the currency.", "links": [{"text": "Issue 1", "href": "https://lennylesser.beehiiv.com/p/about-last-week-issue-1-08fd#onchain-dispatch-what-is-a-cypherpu"}]}, {"t": "p", "text": "We forget that Bitcoin started underground. Early meetups were small, some needed a passcode to get in, and phones got checked at the door. People worried the government would come after them for building money outside its control. This stuff was genuinely disruptive. It wasn’t a corporate networking event. It wasn’t socially accepted. You got looked at sideways for even talking about it."}, {"t": "p", "text": "That’s what being early was."}, {"t": "h", "text": "FROM REBEL TO TICKER"}, {"t": "img", "src": "conf", "cap": "The 2025 Bitcoin Conference in Las Vegas.", "video": false}, {"t": "p", "text": "And here’s what being late looks like. Above, at the 2025 Bitcoin Conference in Las Vegas: Michael Saylor, Steve Aoki, Natalie Brunell and Donald Trump Jr."}, {"t": "p", "text": "Safe to say, they’re not early."}, {"t": "p", "text": "Brunell went on Fox in August 2025 and laid out the easy trade: Bitcoin goes up as governments print money, so just keep buying. Soon after, that correlation broke, and Bitcoin is down roughly 30% since. Not her fault. But funny how it works. The moment easy money gets said out loud on TV, it stops being easy."}, {"t": "p", "text": "Bitcoin has Wall Street ETFs. Public companies stack it on their balance sheets. It went from a disruptive force to the status quo."}, {"t": "p", "text": "And somewhere in there, with a lot of new people coming in, the community changed too."}, {"t": "h", "text": "THE GOALPOSTS KEEP MOVING"}, {"t": "p", "text": "People need to wake up and realize the days of Bitcoin going up multiple times in a year are over."}, {"t": "p", "text": "The vocal new wave of online Bitcoiners first said all we needed was 0.1 Bitcoin to retire early. Then it was 0.2, then 0.25, and now it’s one or even five Bitcoin and you’ll be set for life."}, {"t": "p", "text": "Meanwhile, right under everyone’s nose sit undervalued crypto communities and protocols still innovating: privacy solutions, app building, and transaction times that don’t make you wait."}, {"t": "p", "text": "It’s doubly irresponsible to sell false hope about Bitcoin’s growth rate, then to trash every other crypto project for not being “pure.”"}, {"t": "h", "text": "THE NEW MIDDLEMEN"}, {"t": "p", "text": "Even crazier: the Bitcoin treasury companies. If you haven’t heard of them, here’s the gist. A company (sometimes a brand-new one built for this) exists mainly to hold Bitcoin on its balance sheet. It goes public, and the pitch to regular people is: buy our stock and you get Bitcoin exposure, with smart people managing it for you. By this year, more than 170 public companies were doing some version of this."}, {"t": "p", "text": "How’d that go? Plenty of them have crashed 90% or more. Twenty One Capital, the company Jack Mallers ran, is down more than 80% from its 2025 high, and he stepped down as CEO in July."}, {"t": "img", "src": "xxi_chart", "cap": "Twenty One Capital (XXI), weekly chart.", "alt": "Twenty One Capital (XXI), weekly chart.", "video": false, "badge": ""}, {"t": "p", "text": "The irony writes itself. The movement that was supposed to cut out the middleman built a whole new layer of middlemen, and regular people bought in at the top. Nobody talks about that."}, {"t": "p", "text": "That’s the Bitcoin maxi. And the maxi has gotten delusional, and not in a good way."}, {"t": "h", "text": "DON’T TOUCH THE CODE"}, {"t": "p", "text": "The maxi position is basically: don’t touch the code, ever. Michael Saylor, the biggest corporate Bitcoin holder on the planet, said it straight this year. The biggest threat to Bitcoin is “ambitious opportunists” who want to change the protocol."}, {"t": "p", "text": "Fine. If you want Bitcoin to be pristine sound money and nothing else, I get it. The fear is that if you build too much on top of it, it turns into one more parasitic, capitalist machine. And that changing it in any way opens the door to more changes down the road."}, {"t": "p", "text": "But protecting Bitcoin’s future is one thing. Discouraging people from looking at innovation in other crypto communities, some of which may be real opportunities, is another thing entirely. Sometimes it’s trash talk. Mostly it’s silence. Saylor, the movement’s biggest voice, is careful about what he mentions. And the Bitcoin conference doesn’t put Ethereum’s co-founder, Vitalik Buterin, on its stage. Keep in mind, Vitalik co-founded Bitcoin Magazine. He’s pro-Bitcoin, and one of the most important figures in the broader crypto community."}, {"t": "h", "text": "THE SPLIT"}, {"t": "p", "text": "This summer it got biblical. Back in 2023, people found a loophole that let them stamp images and tokens, basically NFTs, directly onto Bitcoin. Purists led by developer Luke Dashjr called it spam and pushed a rule change, BIP-110, to shut it down and keep Bitcoin money only."}, {"t": "p", "text": "Saylor led the campaign against it. His argument: the network shouldn’t judge what a transaction is for. “Bitcoin does not need guardians of purity. It needs guardians of neutrality.”"}, {"t": "p", "text": "Miners didn’t go along. Support peaked around 2.5%, nowhere near the 55% needed. So on Aug. 8 the purists broke off and launched their own chain, now called Bitcoin BLAKE2b (XBT), as the “real” Bitcoin. It’s still running, traded on a handful of small exchanges."}, {"t": "p", "text": "Here’s the kicker. One side wanted Bitcoin to do less. The other wanted it left exactly as is. Nobody was fighting to let it do more."}, {"t": "p", "text": "That’s the pattern. Most maxis call everything that isn’t Bitcoin a “sh*tcoin.” At best they play nice with Solana, a chain known for meme coins, because they don’t feel threatened by it."}, {"t": "p", "text": "Ethereum, on the other hand, is the one they won’t give its due. It once climbed to about half of Bitcoin’s market cap, close enough to make “the flippening” (Ethereum overtaking Bitcoin) feel possible."}, {"t": "p", "text": "That’s not purity. It’s fear."}, {"t": "h", "text": "REBELLION TO RELIGION"}, {"t": "p", "text": "When Bitcoin was a dollar, it was unknown and undervalued. The weird thing nobody believed in."}, {"t": "pull", "text": "It’s not purity. It’s fear."}, {"t": "p", "text": "Today’s maxis took that rebellion and turned it into a holier-than-thou religion, and lost the cypherpunk vision along the way."}, {"t": "p", "text": "Here’s the punchline: if Bitcoin showed up today, as the strange little underdog it once was, the maxis would be the first ones calling it a scam."}, {"t": "p", "text": "That’s not cypherpunk."}, {"t": "p", "text": "It’s just the herd, all over again."}], "img": "conf", "tags": ["Crypto", "Bitcoin", "Ethereum"], "people": ["Michael Saylor", "Vitalik Buterin", "Luke Dashjr"], "seo_title": "We Need to Talk About Bitcoin (Not What You Think) — Michael Saylor | 20 Blok", "slug": "chain-reaction"}, {"id": "issue-7/lolz", "name": "LOLZ", "emoji": "🤣", "feature": false, "title": "It’s Been a (Ryan) Long Time Coming", "dek": "Earnest irony, back in my sphere.", "media": "", "links": [], "body": [{"t": "p", "text": "I remember watching a COVID-era Ryan Long sketch before I even knew his name. He was in the melee of creators breaking through online back then, and I lost track of him before I ever latched on. Not this time. He's back in my sphere, and I couldn't be happier with his earnest irony."}, {"t": "img", "src": "lolz_clip", "cap": "Ryan Long: actor not sure if he’s supposed to support Israel or Palestine. Watch on YouTube.", "alt": "Ryan Long: actor not sure if he’s supposed to support Israel or Palestine. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/shorts/IkwU13UNwtw"}, {"t": "link", "label": "Ryan Long 🌐 Website →", "href": "https://ryanlongcomedy.com/"}], "img": "lolz_clip", "tags": ["Comedy", "Memes"], "people": ["Ryan Long"], "seo_title": "It’s Been a (Ryan) Long Time Coming | 20 Blok", "slug": "lolz"}, {"id": "issue-7/music-flow", "name": "MUSIC FLOW", "emoji": "🎧", "feature": false, "title": "Moderator, “When I Dream”", "dek": "Laid-back trip-hop with futuristic cowboy vibes.", "media": "", "links": [], "body": [{"t": "p", "text": "From his 2018 album Sinner’s Syndrome, this one is laid-back trip-hop, and I get ’90s electronic, Tarantino, country, futuristic cowboy vibes. Enjoy."}, {"t": "img", "src": "mf_track", "cap": "Moderator, “When I Dream.” Listen on YouTube.", "alt": "Moderator, “When I Dream.” Listen on YouTube.", "video": true, "badge": "LISTEN ON YOUTUBE", "href": "https://www.youtube.com/watch?v=tX1SpTUdZQM"}], "img": "mf_track", "tags": ["Music"], "people": ["Moderator"], "seo_title": "Moderator, “When I Dream” | 20 Blok", "slug": "music-flow"}, {"id": "issue-7/story-beat", "name": "STORY BEAT", "emoji": "📖", "feature": false, "title": "Knowing with Tejiri", "dek": "From Search for Story: intuition, confidence and the mirror.", "media": "", "links": [], "body": [{"t": "carousel", "items": ["sb_car1", "sb_car2", "sb_car3", "sb_car4", "sb_car5", "sb_car6", "sb_car7", "sb_car8"], "alt": "To Know Tejiri is to Know Yourself — Search for Story carousel", "cap": "To Know Tejiri… · swipe or use the arrows"}, {"t": "p", "text": "From my documentary photo series, Search for Story."}, {"t": "p", "text": "“Knowing with Tejiri” is about intuition, self-confidence and security, within yourself and with other people."}, {"t": "img", "src": "sb_triptych", "cap": "", "alt": "Three portraits of Tejiri in a red plaid shirt", "video": false, "badge": ""}, {"t": "p", "text": "When you meet others, they’re like a mirror. You can learn from people, but you won’t find your actual grounded confidence and intuition just by being around somebody else. You still have to do the work."}, {"t": "img", "src": "sb_short", "cap": "Tejiri, in his own words. Watch on YouTube.", "alt": "Tejiri, in his own words. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/shorts/s6cFNS4uCzQ"}, {"t": "p", "text": "Being around such a self-assured, truly explorative, open-minded presence and thinker turns the mirror on yourself, so you pick up from where you are and continue your own journey of knowing.", "em": "So, to know Tejiri is to know yourself."}, {"t": "img", "src": "sb_portrait", "cap": "", "alt": "Tejiri, photographed for Search for Story.", "video": false, "badge": ""}, {"t": "p", "text": "I’ve been thinking a lot about this theme and the word “knowing.” Being in your knowing is a call to live and behave with a healthy sense of intuition: being able to trust it, and knowing the difference between your intuition and fear."}, {"t": "card", "kicker": "Full layout here", "title": "Search for Story", "sub": "Knowing with Tejiri", "cta": "Full story here →", "href": "https://claude.ai/artifact/SUKCAPDz156symYQiV1Hst"}], "img": "sb_portrait", "tags": ["Culture", "Creativity"], "people": ["Tejiri"], "seo_title": "Knowing with Tejiri | 20 Blok", "slug": "story-beat"}, {"id": "issue-7/off-the-path", "name": "OFF THE PATH", "emoji": "🧭", "feature": false, "title": "The Psychology of People Who Refuse Tattoos", "dek": "When the rebellious move becomes the status quo.", "media": "", "links": [], "body": [{"t": "p", "text": "A great example of something contrarian and rebellious turning into the status quo."}, {"t": "img", "src": "otp_video", "cap": "The Psychology of People Who Refuse Tattoos. Watch on YouTube.", "alt": "The Psychology of People Who Refuse Tattoos. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/watch?v=ryd7Uq7eMoA"}], "img": "otp_video", "tags": ["Culture", "Mindset"], "people": [], "seo_title": "The Psychology of People Who Refuse Tattoos | 20 Blok", "slug": "off-the-path"}, {"id": "issue-7/wall-of-sommi", "name": "WALL OF SOMMI", "emoji": "🧱", "feature": false, "title": "The Chart Nobody is Talking About", "dek": "What Bitcoin dominance is really telling us.", "media": "", "links": [], "body": [{"t": "p", "text": "Sommi contends the Bitcoin dominance chart is flashing overbought, and that everybody’s already in. Why is no one talking about it?"}, {"t": "img", "src": "wos_video", "cap": "Sommi on the Bitcoin dominance chart. Watch on YouTube.", "alt": "Sommi on the Bitcoin dominance chart. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/watch?v=JHo5PVkwCko"}, {"t": "link", "label": "🎥 On YouTube: @yourfriendSOMMI →", "href": "https://www.youtube.com/@yourfriendsommi"}], "img": "wos_video", "tags": ["Crypto", "Bitcoin"], "people": ["Sommi"], "seo_title": "The Chart Nobody is Talking About — Sommi | 20 Blok", "slug": "wall-of-sommi"}, {"id": "issue-7/sports-talk", "name": "SPORTS TALK", "emoji": "🏀", "feature": false, "title": "The Foul Heard ‘Round the WNBA", "dek": "A flagrant 2, an ejection and a post from the locker room.", "media": "", "links": [], "body": [{"t": "p", "text": "Banging someone’s head in on a basketball play, getting ejected, and posting “WHITE PRIVILEGE” online while still in the locker room is truly wild."}, {"t": "p", "text": "Back on August 8, the Chicago Sky’s DiJonai Carrington hit the Indiana Fever’s Sophie Cunningham in the face as she drove for a layup, with two minutes left in the first quarter. After review, the refs upgraded it to a flagrant 2 foul and ejected her. She headed to the locker room and posted a cryptic message on Threads, “white privilege,” tagging the Fever."}, {"t": "img", "src": "foul", "cap": "The foul, Aug. 8.", "video": false}, {"t": "p", "text": "I don’t think this moment will be forgotten for a long while, if ever."}, {"t": "p", "text": "Cunningham has been at the center of the mostly media-stoked debate over transgender athletes. She’s said protecting girls and women in sports is “common sense.” The media and others took that as a slight against the transgender community."}, {"t": "p", "text": "In a league that runs heavy on political and social virtue signaling, skewing toward trans and LGBTQ+ causes, the flagrant foul and ejection involving Sophie Cunningham, the heterosexual darling of the WNBA, appeared to have some extra sauce behind it."}, {"t": "p", "text": "Add the whole backstory of Sophie’s teammate Caitlin Clark, who also isn’t with the status quo program of being “a person of color” or a lesbian (two strikes against her), all while being the league’s sensation (which raises other questions, for sure)."}, {"t": "p", "text": "But this did feel directed in a different way."}, {"t": "p", "text": "Carrington walked a fine line after the fact, staying ambiguous but defiant. She never clarified what she meant, and she poked at her critics by telling them to “try exercising your critical thinking skills.” It leaned cryptic and unaccountable."}, {"t": "pull", "text": "I don’t think this moment will be forgotten for a long while, if ever."}, {"t": "p", "text": "Where do you land on this? Was the mid-game “WHITE PRIVILEGE” post a brave example of speaking out? Was there a crafty message there? Or was this misguided victimhood and social justice virtue signaling?"}, {"t": "img", "src": "st_video", "cap": "WNBA struggles: the league and the trans, biology questions. Watch on YouTube.", "alt": "News thumbnail: WNBA struggles, league struggles with trans, biology questions", "video": true, "href": "https://www.youtube.com/watch?v=kRYQG5wmi6g", "badge": "WATCH ON YOUTUBE"}, {"t": "h", "text": "Sources"}, {"t": "link", "label": "Chicago Sun-Times: DiJonai Carrington ejected after hard foul on Sophie Cunningham (Aug 8, 2026) →", "href": "https://chicago.suntimes.com/chicago-sky/2026/08/08/dijonai-carrington-ejected-after-hard-foul-on-sophie-cunningham-as-sky-fall-to-fever"}, {"t": "link", "label": "Here’s a Reddit thread if you want to dig into the discussion →", "href": "https://www.reddit.com/r/wnba/comments/1vl0fqo/carrington_never_linked_ejection_vs_fever_to/"}, {"t": "h", "text": "The posts"}, {"t": "img", "src": "st_threads", "cap": "Carrington’s post on Threads, Aug. 8.", "alt": "DiJonai Carrington Threads post: WHITE PRIVILEGE @indianafever", "video": false}, {"t": "img", "src": "st_kareem", "cap": "Cunningham’s response, via Kareem Copeland.", "alt": "Kareem Copeland post quoting Sophie Cunningham: this has nothing to do with race", "video": false}, {"t": "img", "src": "st_reply", "cap": "Carrington’s reply to her critics on X.", "alt": "DiJonai Carrington reply on X telling critics to try exercising critical thinking skills", "video": false}], "img": "foul", "tags": ["Sports", "WNBA"], "people": ["DiJonai Carrington", "Sophie Cunningham"], "seo_title": "The Foul Heard ‘Round the WNBA — DiJonai Carrington | 20 Blok", "slug": "sports-talk"}, {"id": "issue-7/now-playing", "name": "NOW PLAYING", "emoji": "🍿", "feature": false, "title": "The Devil Wears Prada 2", "dek": "A blast to watch, and a quiet line about what success costs.", "media": "", "links": [], "body": [{"t": "img", "src": "np_clip", "cap": "The Devil Wears Prada 2, official clip. Watch on YouTube.", "alt": "The Devil Wears Prada 2, official clip. Watch on YouTube.", "video": true, "badge": "WATCH ON YOUTUBE", "href": "https://www.youtube.com/watch?v=1-u-e2TLwhs"}, {"t": "p", "text": "Prada 2 hit all the right notes: top-tier performances, a storyline about working in the fashion and beauty industries, well written, great locations—all-around very well done. Lady Gaga is even in it. It’s the perfect mix of quality and entertainment. If you let go and have fun with it, it is truly a blast."}, {"t": "p", "text": "But one thing stood out to me. It was subtle, and once it popped up on screen, I couldn’t stop thinking about it."}, {"t": "h", "text": "At What Cost?"}, {"t": "p", "text": "Toward the end, Miranda Priestly (Meryl Streep) tells Andy (Anne Hathaway) that if she writes a book, it should include how much of her children’s lives she’s missed. “People should know,” she says. “They should know there’s a cost.”"}, {"t": "p", "text": "And then, in the same breath: “I love working.”"}, {"t": "p", "text": "First, credit where it’s due. This is a movie about an industry: fashion, media, work, career. It didn’t have to touch family at all. Somebody in that writers’ room knew it would be a miss to leave it out, and they put it in anyway."}, {"t": "p", "text": "The Catholic Weekly put it well: the film “perhaps inadvertently” shows the consequences of choosing career over family. Miranda has twin daughters she hasn’t been there for. Andy, twenty years after the first movie, regrets never marrying and having a family of her own."}, {"t": "p", "text": "Two women, both at the top, and both paid for it."}, {"t": "pull", "text": "Two women, both at the top, and both paid for it."}, {"t": "h", "text": "The Other Cost"}, {"t": "p", "text": "Here’s the part nobody says out loud. The cost isn’t only the family. It’s who you become."}, {"t": "p", "text": "Miranda is great at her job. She’s also famously cold, cutting, and hard on everyone around her. That’s the whole shtick of the character, and the movies glamorize it."}, {"t": "p", "text": "So is that what we’ve decided? Being great at your job is the whole point, even if it turns you into someone people don’t like? Money, status and competition can do that to anyone, men or women. On screen it’s glossy and entertaining. In real life it’s a lot less glamorous."}, {"t": "h", "text": "Maybe the Real Message"}, {"t": "p", "text": "Watching it again in my head, maybe there’s something subtler in that moment. Miranda, at a career high, telling the one person she respects: keep working with me, yes,,,but don’t end up like me. Think about the family."}, {"t": "p", "text": "If that’s what they meant, it’s one of the most honest parts in the movie."}, {"t": "h", "text": "Further Reading"}, {"t": "p", "text": "The Catholic Weekly: Glamour, ambition and a lesson from The Devil Wears Prada 2 → https://catholicweekly.com.au/glamour-ambition-and-a-lesson-from-devil-wears-prada-2/"}, {"t": "p", "text": "HerMoney: The Devil Wears Prada 2 agrees with Emma Grede: there is a cost to success → https://hermoney.com/earn/work-life-balance/the-devil-wears-prada-2-agrees-with-emma-grede-there-is-a-cost-to-success/"}, {"t": "p", "text": "Plugged In: The Devil Wears Prada 2 review → https://www.pluggedin.com/movie-reviews/devil-wears-prada-2-2026/"}], "img": "np_clip", "tags": ["Film"], "people": ["The Devil Wears Prada 2"], "seo_title": "The Devil Wears Prada 2 | 20 Blok", "slug": "now-playing"}, {"id": "issue-7/based", "name": "BASED", "emoji": "🧨", "feature": false, "title": "Banksy Makes a Statement (Again)", "dek": "A flag, a plinth and a step into thin air.", "media": "", "links": [], "body": [{"t": "img", "src": "based_header", "cap": "", "alt": "BASED: a lone figure stands in a ruined city", "video": false, "badge": ""}, {"t": "p", "text": "From the time he dropped on the scene to Exit Through the Gift Shop and beyond, it's been hard to know what's real with Banksy. He lives in the shadows, and it's hard to believe one person pulls all this off. Is it a media stunt? Who's really in on it?"}, {"t": "p", "text": "Back in April, he did it again. Overnight, a statue appeared in Waterloo Place in central London: a man in a suit marching proudly with a big flag, the cloth covering his face, stepping off the edge of the plinth into thin air. It went up the same week King Charles was on a state visit to the U.S. A day later, a video on Banksy's Instagram confirmed it was his. It's set to \"Pomp and Circumstance\" and ends with a passerby saying how much he dislikes it. Westminster's council says it's staying."}, {"t": "p", "text": "Whoever he is (a Reuters investigation named him as Robin Gunningham; he's never confirmed or denied it), the optics are fun, exciting, contrarian and full of dissent. \"Interesting\" doesn't cover it. Call it mischief."}, {"t": "img", "src": "based_ig", "cap": "Banksy’s post, April 30, 2026. Watch on Instagram.", "alt": "Banksy statue: a man in a suit marching with a flag covering his face", "video": true, "badge": "WATCH ON INSTAGRAM", "href": "https://www.instagram.com/reels/DXwf7pis6KT/"}], "img": "based_tile", "tags": ["Street Art", "Culture"], "people": ["Banksy"], "seo_title": "Banksy Makes a Statement (Again) | 20 Blok", "slug": "based"}];
